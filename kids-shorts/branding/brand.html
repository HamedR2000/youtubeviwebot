<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Fredoka;font-weight:700;src:url(../node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2)}
@font-face{font-family:Fredoka;font-weight:600;src:url(../node_modules/@fontsource/fredoka/files/fredoka-latin-600-normal.woff2)}
html,body{margin:0;overflow:hidden;background:transparent}text{font-family:Fredoka,sans-serif;font-weight:700}
</style><script src="../characters.js"></script></head><body>
<svg id="s" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const { penny, ellie, coco } = window.CHARACTERS;
const RAINBOW = ['#FF6B6B', '#FF9F1C', '#FFD23F', '#4CB944', '#4D96FF', '#9B5DE5'];
const star = (x, y, r, f, rot = 0) => `<path transform="translate(${x} ${y}) rotate(${rot}) scale(${r / 26})" d="M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z" fill="${f}"/>`;
const cloud = (x, y, s, o = 0.95) => `<g transform="translate(${x} ${y}) scale(${s})" fill="#fff" opacity="${o}"><circle r="50"/><circle cx="55" cy="-22" r="62"/><circle cx="115" r="48"/><circle cx="58" cy="18" r="50"/></g>`;
const bubbleText = (x, y, txt, size, fill, rot = 0) => `<text x="${x}" y="${y}" transform="rotate(${rot} ${x} ${y})" text-anchor="middle" font-size="${size}" fill="${fill}" stroke="#fff" stroke-width="${size / 15}" paint-order="stroke">${txt}</text>`;
const shape = (d, x, y, s, f, r = 0) => `<path d="${d}" transform="translate(${x} ${y}) rotate(${r}) scale(${s})" fill="${f}" stroke="#3B2B4F" stroke-width="${8 / s}" stroke-linejoin="round"/>`;
const TRI = 'M 0 -60 L 60 45 L -60 45 Z', SQ = 'M -50 -50 H 50 V 50 H -50 Z', HEART = 'M 0 -30 C -12 -60 -66 -52 -61 -10 C -57 22 -22 42 0 62 C 22 42 57 22 61 -10 C 66 -52 12 -60 0 -30 Z', CIRC = 'M 0 -55 A 55 55 0 1 1 -0.01 -55';

window.make = (kind) => {
  const s = document.getElementById('s');
  if (kind === 'avatar') {
    s.setAttribute('width', 800); s.setAttribute('height', 800);
    const ring = RAINBOW.map((c, i) => `<circle cx="400" cy="400" r="${380 - i * 16}" fill="${c}"/>`).join('');
    s.innerHTML = `<defs><radialGradient id="g" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#FFF8D6"/><stop offset="1" stop-color="#FFE08A"/></radialGradient></defs>
      <rect width="800" height="800" fill="#FFD23F"/>${ring}<circle cx="400" cy="400" r="284" fill="url(#g)"/>
      ${star(205, 250, 26, '#FF6B6B', 10)}${star(600, 230, 20, '#4D96FF', -8)}${star(610, 560, 24, '#9B5DE5', 15)}${star(215, 570, 18, '#4CB944')}
      <g transform="translate(320 640) rotate(22) scale(1.12)">${penny()}</g>`;
  } else if (kind === 'watermark') {
    s.setAttribute('width', 300); s.setAttribute('height', 300);
    s.innerHTML = `<circle cx="150" cy="150" r="146" fill="#FFD23F"/><circle cx="150" cy="150" r="132" fill="#FFF8D6"/>
      <g transform="translate(118 252) rotate(22) scale(0.47)">${penny()}</g>`;
  } else {
    s.setAttribute('width', 2560); s.setAttribute('height', 1440);
    const arcs = RAINBOW.map((c, i) => `<path d="M ${380 + i * 46} 1440 A ${900 - i * 46} ${900 - i * 46} 0 0 1 ${2180 - i * 46} 1440" fill="none" stroke="${c}" stroke-width="46" opacity="0.9"/>`).join('');
    s.innerHTML = `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FD3FF"/><stop offset="0.6" stop-color="#CDEFFF"/><stop offset="1" stop-color="#FFF1D6"/></linearGradient></defs>
      <rect width="2560" height="1440" fill="url(#sky)"/>
      <circle cx="2330" cy="230" r="120" fill="#FFD23F"/><circle cx="2330" cy="230" r="150" fill="#FFD23F" opacity="0.3"/>
      ${cloud(240, 240, 1.6)}${cloud(1700, 170, 1.2)}${cloud(900, 120, 1.0, 0.8)}${cloud(2150, 520, 1.1, 0.85)}${cloud(140, 760, 1.2, 0.85)}
      ${arcs}
      <path d="M 0 1180 C 400 1080 800 1260 1280 1180 C 1760 1100 2160 1250 2560 1160 L 2560 1440 L 0 1440 Z" fill="#7BD389"/>
      <path d="M 0 1290 C 500 1220 900 1350 1400 1290 C 1900 1230 2200 1330 2560 1290 L 2560 1440 L 0 1440 Z" fill="#4CB944"/>
      ${bubbleText(170, 520, 'A', 150, '#FF6B6B', -12)}<text x="330" y="470" transform="rotate(8 330 470)" text-anchor="middle" font-size="140" font-weight="600" style="font-weight:600" fill="#4D96FF" stroke="#fff" stroke-width="8" paint-order="stroke">B</text>${bubbleText(250, 660, 'C', 120, '#4CB944', -4)}
      ${bubbleText(2250, 860, '1', 150, '#9B5DE5', 10)}${bubbleText(2400, 760, '2', 130, '#FF9F1C', -8)}${bubbleText(2420, 960, '3', 120, '#F15BB5', 6)}
      ${shape(TRI, 470, 1000, 1.1, '#4CB944', -8)}${shape(CIRC, 2120, 1060, 1.0, '#FFD23F')}${shape(HEART, 330, 1060, 1.0, '#F2545B', 8)}${shape(SQ, 2340, 1110, 0.9, '#4D96FF', 12)}
      ${star(620, 560, 30, '#FF9F1C', 12)}${star(1940, 560, 26, '#F15BB5', -10)}${star(1080, 560, 20, '#4D96FF')}${star(1500, 545, 22, '#4CB944', 20)}
      <g transform="translate(690 925) rotate(-10) scale(0.8)">${penny()}</g>
      ${bubbleText(1265, 740, 'Doodle Pals', 180, '#FF6B6B')}
      <text x="1265" y="820" text-anchor="middle" font-size="52" fill="#3B2B4F" stroke="#fff" stroke-width="10" paint-order="stroke">Shapes • Numbers • ABC • Animals</text>
      <rect x="1035" y="850" width="460" height="64" rx="32" fill="#FF9F1C"/><text x="1265" y="894" text-anchor="middle" font-size="36" fill="#fff">NEW SHORTS EVERY DAY!</text>
      <g transform="translate(1880 925) rotate(6) scale(0.8)">${ellie()}</g>
      <g transform="translate(2015 930) rotate(-8) scale(0.72)">${coco()}</g>`;
  }
};
</script></body></html>
