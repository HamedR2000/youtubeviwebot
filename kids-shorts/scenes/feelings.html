<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- "I feel happy!" Short: a big doodle face turns from calm to the feeling, the reason appears under it,
     then "Can you make a happy face?", the word is spelled, and "How do you feel today?" -->
<style>
  @font-face { font-family: Fredoka; font-weight: 700; src: url(../node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #FFF6E9; }
  svg { display: block; }
  text { font-family: Fredoka, sans-serif; font-weight: 700; }
</style>
<script src="../topics.js"></script>
<script src="../characters.js"></script>
</head>
<body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF0F6"/><stop offset="0.55" stop-color="#FFF8E8"/><stop offset="1" stop-color="#EAF6FF"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5A3A7A" flood-opacity="0.18"/></filter>
    <pattern id="dots" width="60" height="60" patternUnits="userSpaceOnUse"><circle cx="30" cy="30" r="3" fill="#E2E2F0"/></pattern>
    <radialGradient id="shine" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/><stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <g id="clouds"></g>
  <g filter="url(#soft)"><rect x="90" y="470" width="900" height="980" rx="64" fill="#FFFDF8"/></g>
  <rect x="90" y="470" width="900" height="980" rx="64" fill="url(#dots)" opacity="0.55"/>
  <text id="t1" x="540" y="250" text-anchor="middle" font-size="72" fill="#5B4A7A"></text>
  <text id="t2" x="540" y="385" text-anchor="middle" font-size="140" fill="#F15BB5" stroke="#FFFFFF" stroke-width="10" paint-order="stroke"></text>
  <g id="faceWrap"><g id="calm"></g><g id="feel"></g></g>
  <text id="why" x="540" y="1385" text-anchor="middle" font-size="54" fill="#5B4A7A" opacity="0"></text>
  <g id="word"></g>
  <text id="ask" x="540" y="1790" text-anchor="middle" font-size="72" fill="#5B4A7A" opacity="0">How do you feel today?</text>
  <g id="sparkles"></g>
  <g id="penny"></g>
</svg>
<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const easeInOut = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeBack = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const PAL = ['#FF6B6B', '#FF9F1C', '#2EC4B6', '#4D96FF', '#9B5DE5', '#F15BB5'];
const INK = '#3B2B4F';
const O = `stroke="${INK}" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"`;
const STAR = 'M0 -46 L13 -14 L46 -12 L20 9 L28 42 L0 24 L-28 42 L-20 9 L-46 -12 L-13 -14 Z';
const HEART = 'M0 34 C -50 0 -46 -38 -22 -38 C -8 -38 0 -26 0 -18 C 0 -26 8 -38 22 -38 C 46 -38 50 0 0 34 Z';

// one eye at (x, 0) in face coordinates (face radius 300)
function eye(kind, side) {
  switch (kind) {
    case 'happy': return `<path d="M -45 12 Q 0 -40 45 12" fill="none" ${O}/>`;
    case 'closed': return `<path d="M -45 -4 Q 0 30 45 -4" fill="none" ${O}/>`;
    case 'wide': return `<circle r="54" fill="#fff" ${O}/><circle cy="4" r="26" fill="${INK}"/><circle cx="8" cy="-6" r="9" fill="#fff"/>`;
    case 'down': return `<ellipse cy="18" rx="26" ry="30" fill="${INK}"/><circle cx="6" cy="10" r="8" fill="#fff"/>`;
    case 'star': return `<path d="${STAR}" transform="scale(1.15)" fill="#FFD23F" ${O}/>`;
    case 'heart': return `<path d="${HEART}" transform="scale(1.3)" fill="#FF4F7A" ${O}/>`;
    case 'wink': return side < 0 ? eye('open') : eye('happy');
    default: return `<ellipse rx="32" ry="42" fill="${INK}"/><circle cx="10" cy="-14" r="11" fill="#fff"/>`;
  }
}
function brow(kind, side) { // side -1 = left eyebrow
  if (!kind) return '';
  const inner = { up: -26, down: 26, high: -20 }[kind], outer = { up: 12, down: -12, high: -20 }[kind], y = kind === 'high' ? -150 : -130;
  const xi = side * 60, xo = side * 160;
  return `<path d="M ${xo} ${y + outer} Q ${(xi + xo) / 2} ${y + Math.min(inner, outer) - 14} ${xi} ${y + inner}" fill="none" stroke="${INK}" stroke-width="16" stroke-linecap="round"/>`;
}
function mouth(kind) {
  switch (kind) {
    case 'bigsmile': return `<path d="M -125 60 Q 0 230 125 60 Z" fill="#E63946" ${O}/><path d="M -100 64 L 100 64 L 90 86 L -90 86 Z" fill="#fff"/><ellipse cx="0" cy="140" rx="45" ry="20" fill="#FF8FA3"/>`;
    case 'smile': return `<path d="M -105 70 Q 0 170 105 70" fill="none" ${O} stroke-width="14"/>`;
    case 'frown': return `<path d="M -90 145 Q 0 60 90 145" fill="none" ${O} stroke-width="14"/>`;
    case 'angry': return `<path d="M -90 125 Q 0 85 90 125" fill="none" ${O} stroke-width="14"/>`;
    case 'bigo': return `<ellipse cy="110" rx="62" ry="82" fill="#7A2335" ${O}/><ellipse cy="150" rx="34" ry="20" fill="#FF8FA3"/>`;
    case 'o': return `<ellipse cy="105" rx="40" ry="50" fill="#7A2335" ${O}/>`;
    case 'small': return `<path d="M -50 100 Q 0 135 50 100" fill="none" ${O}/>`;
    case 'wavy': return `<path d="M -90 115 q 22 -26 45 0 t 45 0 t 45 0 t 45 0" fill="none" ${O}/>`;
    case 'tongue': return `<path d="M -110 70 Q 0 180 110 70" fill="none" ${O} stroke-width="14"/><path d="M 10 118 C 10 200 90 200 85 108 Z" fill="#FF6B8A" ${O}/><path d="M 48 128 L 46 165" stroke="#C93A5A" stroke-width="6" stroke-linecap="round"/>`;
    default: return `<path d="M -70 90 Q 0 130 70 90" fill="none" ${O}/>`;
  }
}
function face(f, hue) {
  return `<circle r="300" fill="${hue}" ${O} stroke-width="14"/><circle r="300" fill="url(#shine)"/>
    ${f.extra === 'blush' || f.extra === 'hearts' || f.mouth === 'bigsmile' ? '<ellipse cx="-185" cy="60" rx="48" ry="28" fill="#FF6F91" opacity="0.55"/><ellipse cx="185" cy="60" rx="48" ry="28" fill="#FF6F91" opacity="0.55"/>' : ''}
    <g transform="translate(-110 -50)">${eye(f.eyes, -1)}</g><g transform="translate(110 -50)">${eye(f.eyes, 1)}</g>
    ${brow(f.brows, -1)}${brow(f.brows, 1)}
    <g>${mouth(f.mouth)}</g>`;
}

const T = { titleIn: 0.2, show: 2.6, why: 4.6, make: 8.0, word: 12.6, letterGap: 0.5, ask: 16.4, end: 20 };
const CX = 540, CY = 900, SC = 0.95;
let S = null;

function setup(topicId) {
  const topic = window.TOPICS.find(t => t.id === topicId) || window.TOPICS.find(t => t.template === 'feelings');
  for (const id of ['calm', 'feel', 'word', 'clouds', 'sparkles']) $(id).innerHTML = '';
  const f = topic.face;
  $('calm').innerHTML = face({ eyes: 'open', mouth: 'calm' }, '#FFE3C2');
  $('feel').innerHTML = `<g id="feelFace">${face(f, topic.hue)}</g><g id="fx"></g>`;
  // extras that move: tear, sweat, zzz, steam puffs, sparkles, hearts
  const fx = [];
  const g = $('fx');
  if (f.extra === 'tear') for (const s of [-1, 1]) fx.push({ kind: 'tear', e: el('path', { d: 'M0 -26 C 18 0 22 14 0 26 C -22 14 -18 0 0 -26 Z', fill: '#5BC0FF', stroke: INK, 'stroke-width': 6 }, g), x: s * 120, y: 10, ph: s > 0 ? 0.5 : 0 });
  if (f.extra === 'sweat') fx.push({ kind: 'tear', e: el('path', { d: 'M0 -30 C 20 0 24 16 0 28 C -24 16 -20 0 0 -30 Z', fill: '#BFE6FF', stroke: INK, 'stroke-width': 6 }, g), x: 230, y: -170, ph: 0 });
  if (f.extra === 'zzz') ['z', 'z', 'Z'].forEach((c, i) => { const t = el('text', { 'font-size': 60 + i * 24, fill: '#6C6FB8', stroke: '#fff', 'stroke-width': 8, 'paint-order': 'stroke' }, g); t.textContent = c; fx.push({ kind: 'zzz', e: t, i }); });
  if (f.extra === 'steam') for (const s of [-1, 1]) for (let i = 0; i < 3; i++) fx.push({ kind: 'steam', e: el('circle', { r: 26 - i * 5, fill: '#FFE1DC', stroke: '#D9534F', 'stroke-width': 6 }, g), s, i });
  if (f.extra === 'sparkle') for (let i = 0; i < 6; i++) fx.push({ kind: 'spark', e: el('path', { d: 'M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z', fill: PAL[i % 6] }, g), a: i * 1.047, i });
  if (f.extra === 'hearts') for (let i = 0; i < 5; i++) fx.push({ kind: 'heart', e: el('path', { d: HEART, fill: '#FF4F7A', stroke: '#fff', 'stroke-width': 5 }, g), i });
  const clouds = [[180, 140, 1.0], [880, 90, 0.8], [760, 1560, 0.6], [100, 1620, 0.7]].map(([x, y, s]) => {
    const c = el('g', {}, $('clouds')); for (const [dx, dy, r] of [[0, 0, 50], [55, -20, 62], [115, 0, 48], [58, 18, 50]]) el('circle', { cx: dx, cy: dy, r, fill: '#FFFFFF', opacity: 0.85 }, c); return { g: c, x, y, s };
  });
  const W = topic.word, L = W.length, step = Math.min(125, 940 / L), fs = Math.min(160, step * 1.3);
  T.letterGap = Math.min(0.5, 3.0 / L);
  const letters = W.split('').map((ch, i) => { const x = 540 + (i - (L - 1) / 2) * step;
    const t = el('text', { x, y: 1600, 'text-anchor': 'middle', 'font-size': fs, fill: PAL[i % 6], stroke: '#fff', 'stroke-width': 10, 'paint-order': 'stroke' }, $('word')); t.textContent = ch; return { t, x }; });
  const sparkles = Array.from({ length: 14 }, (_, i) => { const a = i * 2.39996, d = 380 + (i * 47) % 140;
    const sp = el('path', { d: 'M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z', fill: PAL[i % 6] }, $('sparkles')); return { g: sp, x: 540 + Math.cos(a) * d, y: 960 + Math.sin(a) * d, delay: (i % 6) * 0.1 }; });
  $('penny').innerHTML = `<g id="pennyInner">${window.CHARACTERS.penny()}</g>`;
  // the reason, on two lines when it is two sentences
  const parts = topic.why.match(/[^.!?]+[.!?]+(\s|$)/g) || [topic.why];
  const lines = parts.length > 1 && topic.why.length > 26 ? [parts[0].trim(), parts.slice(1).join('').trim()] : [topic.why];
  $('why').innerHTML = '';
  lines.forEach((ln, i) => { const ts = el('tspan', { x: 540, dy: i ? '1.15em' : (lines.length > 1 ? '-0.55em' : '0') }, $('why')); ts.textContent = ln; });
  $('why').setAttribute('font-size', Math.min(60, 1500 / Math.max(...lines.map(l => l.length))));
  S = { topic, fx, clouds, letters, sparkles, w2: `${W}!`, fs2: Math.min(140, 980 / ((L + 1) * 0.62)), fs3: Math.min(120, 980 / ((L + 6) * 0.58)) };
  window.TIMELINE = { ...T, letters: L, template: 'feelings' };
  window.DURATION = T.end;
  render(0);
  return window.TIMELINE;
}

function render(t) {
  S.clouds.forEach((c, i) => c.g.setAttribute('transform', `translate(${c.x + Math.sin(t * 0.4 + i) * 25} ${c.y}) scale(${c.s})`));
  const make = t >= T.make && t < T.word;
  $('t1').textContent = make ? 'Can you make a' : t >= T.show ? 'I feel' : 'How do you';
  $('t2').textContent = make ? `${S.topic.word.toLowerCase()} face?` : t >= T.show ? S.w2 : 'FEEL?';
  $('t2').setAttribute('font-size', make ? S.fs3 : t >= T.show ? S.fs2 : 140);
  $('t2').setAttribute('fill', make ? '#2EC4B6' : '#F15BB5');
  const pop = t >= T.make ? easeBack(prog(t, T.make, T.make + 0.5)) : t >= T.show ? easeBack(prog(t, T.show, T.show + 0.5)) : easeBack(prog(t, T.titleIn, T.titleIn + 0.7));
  $('t1').setAttribute('transform', `translate(540 250) scale(${pop}) translate(-540 -250)`);
  $('t2').setAttribute('transform', `translate(0 ${Math.sin(t * 2.2) * 6}) translate(540 340) scale(${pop}) translate(-540 -340)`);
  // the face: calm, then a squish-pop into the feeling; it keeps a gentle bounce
  const k = prog(t, T.show - 0.15, T.show + 0.15);
  const squish = t >= T.show - 0.3 && t < T.show + 0.6 ? 1 + 0.12 * Math.sin(prog(t, T.show - 0.3, T.show + 0.6) * Math.PI * 2) : 1;
  const bob = Math.sin(t * 2.4) * 10, tilt = Math.sin(t * 1.7) * 3 + (S.topic.word === 'PROUD' && t > T.show ? -6 : 0) + (S.topic.word === 'SHY' && t > T.show ? 8 : 0);
  const shake = S.topic.word === 'ANGRY' && t > T.show && t < T.show + 1.5 ? Math.sin(t * 50) * 6 : 0;
  const bounce = S.topic.word === 'EXCITED' && t > T.show ? -Math.abs(Math.sin(t * 6)) * 30 : 0;
  $('faceWrap').setAttribute('transform', `translate(${CX + shake} ${CY + bob + bounce}) rotate(${tilt}) scale(${SC * squish} ${SC / squish})`);
  $('calm').setAttribute('opacity', 1 - k); $('feel').setAttribute('opacity', k);
  // moving extras
  const fk = prog(t, T.show + 0.3, T.show + 0.8);
  for (const f of S.fx) {
    if (f.kind === 'tear') { const c = ((t - T.show) * 0.6 + f.ph) % 1; f.e.setAttribute('transform', `translate(${f.x} ${f.y + c * 120})`); f.e.setAttribute('opacity', fk * (1 - c * c)); }
    if (f.kind === 'zzz') { const c = ((t * 0.35 + f.i / 3) % 1); f.e.setAttribute('x', 200 + c * 120 + f.i * 18); f.e.setAttribute('y', -200 - c * 200 - f.i * 20); f.e.setAttribute('opacity', fk * Math.sin(c * Math.PI)); }
    if (f.kind === 'steam') { const c = ((t * 0.9 + f.i / 3) % 1); f.e.setAttribute('cx', f.s * (200 + c * 60)); f.e.setAttribute('cy', -260 - c * 120); f.e.setAttribute('opacity', fk * Math.sin(c * Math.PI)); }
    if (f.kind === 'spark') { const a = f.a + t * 0.6, r = 360 + Math.sin(t * 3 + f.i) * 20; f.e.setAttribute('transform', `translate(${Math.cos(a) * r} ${Math.sin(a) * r}) scale(${0.8 + Math.sin(t * 6 + f.i) * 0.3}) rotate(${t * 60})`); f.e.setAttribute('opacity', fk); }
    if (f.kind === 'heart') { const c = ((t * 0.3 + f.i / 5) % 1); f.e.setAttribute('transform', `translate(${(f.i - 2) * 150 + Math.sin(t * 2 + f.i) * 20} ${-230 - c * 260}) scale(${0.8 + c * 0.4})`); f.e.setAttribute('opacity', fk * Math.sin(c * Math.PI)); }
  }
  // the reason
  const wk = easeBack(prog(t, T.why, T.why + 0.5));
  $('why').setAttribute('opacity', t >= T.why && t < T.word ? clamp(wk) : 0);
  $('why').setAttribute('transform', `translate(540 1370) scale(${wk}) translate(-540 -1370)`);
  // Penny flies in and cheers along
  const pk = easeInOut(prog(t, 0.4, 1.2));
  $('penny').setAttribute('transform', `translate(${lerp(1250, 930, pk)} ${1470 - Math.abs(Math.sin(t * 3)) * 14}) scale(0.5)`);
  $('pennyInner').setAttribute('transform', `rotate(${Math.sin(t * 3) * 8})`);
  S.letters.forEach(({ t: tx2, x }, i) => { const s = T.word + i * T.letterGap, kk = easeBack(prog(t, s, s + 0.4));
    const hop = t > s + 0.4 ? -Math.abs(Math.sin((t - s) * 3)) * 10 : 0;
    tx2.setAttribute('transform', `translate(${x} ${1600 + hop}) scale(${kk}) translate(${-x} -1600)`); tx2.setAttribute('opacity', kk > 0 ? 1 : 0); });
  const ak = easeBack(prog(t, T.ask, T.ask + 0.6));
  $('ask').setAttribute('opacity', clamp(ak)); $('ask').setAttribute('transform', `translate(540 1770) scale(${ak}) translate(-540 -1770)`);
  S.sparkles.forEach(s2 => { const kk = prog(t, T.make + s2.delay, T.make + s2.delay + 0.6);
    s2.g.setAttribute('transform', `translate(${s2.x} ${s2.y}) scale(${kk >= 1 ? 0.6 + Math.sin(t * 6 + s2.x) * 0.2 : easeBack(kk)}) rotate(${t * 40})`); s2.g.setAttribute('opacity', kk > 0 && t < T.word ? 1 : 0); });
}
window.setup = setup; window.render = render;
setup(new URLSearchParams(location.search).get('topic') || 'feel-happy');
</script>
</body>
</html>
