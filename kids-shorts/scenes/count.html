<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Fredoka; font-weight: 700; src: url(../node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #FFF6E9; }
  svg { display: block; }
  text { font-family: Fredoka, sans-serif; font-weight: 700; }
  .pop { transform-box: fill-box; transform-origin: center; }
</style>
<script src="../topics.js"></script>
</head>
<body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3F7E8"/><stop offset="0.55" stop-color="#FFF4E4"/><stop offset="1" stop-color="#E6EEFF"/>
    </linearGradient>
    <linearGradient id="numFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9F1C"/><stop offset="0.5" stop-color="#F15BB5"/><stop offset="1" stop-color="#4D96FF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7A5A3A" flood-opacity="0.18"/>
    </filter>
    <pattern id="dots" width="60" height="60" patternUnits="userSpaceOnUse"><circle cx="30" cy="30" r="3" fill="#E9D9C6"/></pattern>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <g id="clouds"></g>
  <g filter="url(#soft)"><rect x="90" y="470" width="900" height="900" rx="64" fill="#FFFDF8"/></g>
  <rect x="90" y="470" width="900" height="900" rx="64" fill="url(#dots)" opacity="0.55"/>

  <text id="t1" x="540" y="250" text-anchor="middle" font-size="72" fill="#5B4A7A"></text>
  <text id="t2" x="540" y="385" text-anchor="middle" font-size="150" fill="#2EC4B6" stroke="#FFFFFF" stroke-width="10" paint-order="stroke"></text>

  <g id="numWrap" transform="translate(540 730)">
    <g id="num" class="pop">
      <g id="numColor"></g>
      <g id="numStrokes"></g>
    </g>
  </g>
  <g id="objects"></g>
  <g id="word"></g>
  <text id="ask" x="540" y="1760" text-anchor="middle" font-size="76" fill="#5B4A7A" opacity="0"></text>
  <g id="sparkles"></g>

  <g id="penny"><g id="pennyInner"><g transform="rotate(28)">
    <path d="M 0 0 L -36 -95 L 36 -95 Z" fill="#F7D2A6"/><path d="M 0 0 L -12 -32 L 12 -32 Z" fill="#3B2B4F"/>
    <rect x="-38" y="-370" width="76" height="278" rx="8" fill="#FFC93C"/><rect x="-38" y="-370" width="22" height="278" fill="#FFB020" opacity="0.6"/>
    <rect x="-40" y="-400" width="80" height="34" rx="6" fill="#C9CED6"/><rect x="-40" y="-452" width="80" height="58" rx="22" fill="#FF8FA3"/>
    <ellipse id="pEyeL" cx="-14" cy="-262" rx="7" ry="10" fill="#3B2B4F"/><ellipse id="pEyeR" cx="16" cy="-262" rx="7" ry="10" fill="#3B2B4F"/>
    <path d="M -14 -236 Q 1 -220 16 -236" fill="none" stroke="#3B2B4F" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="-26" cy="-240" rx="8" ry="5" fill="#FF8FA3" opacity="0.8"/><ellipse cx="28" cy="-240" rx="8" ry="5" fill="#FF8FA3" opacity="0.8"/>
  </g></g></g>
</svg>

<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const easeInOut = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeBack = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const COLORS = ['#FF6B6B', '#FF9F1C', '#2EC4B6', '#4D96FF', '#9B5DE5', '#F15BB5'];
const NX = 540, NY = 730, NS_ = 0.62; // numeral position and scale
const FACE = `<ellipse cx="-150" cy="60" rx="46" ry="30" fill="#FF8FA3" opacity="0.75"/><ellipse cx="150" cy="60" rx="46" ry="30" fill="#FF8FA3" opacity="0.75"/>
<g transform="translate(-95 -40)"><ellipse rx="34" ry="44" fill="#3B2B4F"/><circle cx="10" cy="-14" r="11" fill="#fff"/></g>
<g transform="translate(95 -40)"><ellipse rx="34" ry="44" fill="#3B2B4F"/><circle cx="10" cy="-14" r="11" fill="#fff"/></g>
<path d="M -90 70 Q 0 160 90 70" fill="none" stroke="#3B2B4F" stroke-width="18" stroke-linecap="round"/>`;

const T = { titleIn: 0.2, pennyToStart: [1.4, 2.2], draw: [2.2, 5.0], pennyAway: [5.0, 5.8], color: 5.2,
  count: 6.8, countGap: 0.9, result: 0, word: 13.6, letterGap: 0.5, ask: 16.6, end: 20 };
let S = null;

function miniArt(topic, parent) { // the shape topic's finished character, as a reusable object
  const g = el('g', {}, parent);
  for (const layer of ['back', 'fill', 'front']) for (const [tag, attrs] of topic[layer]) el(tag, attrs, g);
  const f = el('g', { transform: `translate(0 ${topic.face.y}) scale(${topic.face.s})` }, g);
  f.innerHTML = FACE;
  const o = topic.strokes[0];
  el('path', { d: o, fill: 'none', stroke: '#3B2B4F', 'stroke-width': 22, 'stroke-linejoin': 'round' }, g);
  return g;
}

function setup(topicId) {
  const topic = window.TOPICS.find(t => t.id === topicId) || window.TOPICS.find(t => t.template === 'count');
  const n = topic.n, obj = window.TOPICS.find(t => t.id === topic.object);
  T.countGap = Math.min(0.9, 5.2 / n);
  T.result = T.count + n * T.countGap + 0.2;
  T.letterGap = Math.min(0.5, 2.6 / topic.word.length);
  for (const id of ['numColor', 'numStrokes', 'objects', 'word', 'clouds', 'sparkles']) $(id).innerHTML = '';

  const strokes = topic.strokes.map(d => {
    el('path', { d, fill: 'none', stroke: 'url(#numFill)', 'stroke-width': 70, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, $('numColor'));
    const p = el('path', { d, fill: 'none', stroke: '#3B2B4F', 'stroke-width': 26, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, $('numStrokes'));
    const len = p.getTotalLength(); p.setAttribute('stroke-dasharray', len);
    return { p, len };
  });
  const total = strokes.reduce((a, s) => a + s.len, 0); let acc = 0;
  strokes.forEach(s => { s.a = acc / total; acc += s.len; s.b = acc / total; });
  $('numWrap').setAttribute('transform', `translate(${NX} ${NY}) scale(${NS_})`);

  // objects grid
  const rows = n <= 5 ? [n] : [Math.ceil(n / 2), Math.floor(n / 2)];
  const ys = rows.length === 1 ? [1150] : [1060, 1245];
  const objects = []; let k = 0;
  rows.forEach((cnt, r) => { for (let i = 0; i < cnt; i++) {
    const x = 540 + (i - (cnt - 1) / 2) * 168, y = ys[r];
    const g = el('g', { class: 'pop' }, $('objects'));
    const art = miniArt(obj, g); art.setAttribute('transform', `translate(${x} ${y}) scale(${rows.length === 1 && n <= 3 ? 0.3 : 0.21})`);
    const lab = el('text', { x: x + 48, y: y + 70, 'text-anchor': 'middle', 'font-size': 46, fill: COLORS[k % 6], stroke: '#fff', 'stroke-width': 8, 'paint-order': 'stroke' }, g);
    lab.textContent = k + 1;
    objects.push({ g, x, y }); k++;
  } });

  const clouds = [[180, 140, 1.0], [880, 90, 0.8], [700, 1500, 0.7], [120, 1650, 0.9]].map(([x, y, s]) => {
    const g = el('g', {}, $('clouds'));
    for (const [dx, dy, r] of [[0, 0, 50], [55, -20, 62], [115, 0, 48], [58, 18, 50]]) el('circle', { cx: dx, cy: dy, r, fill: '#FFFFFF', opacity: 0.85 }, g);
    return { g, x, y, s };
  });
  const L = topic.word.length, step = Math.min(125, 940 / L), fs = Math.min(160, step * 1.3);
  const letters = topic.word.split('').map((ch, i) => {
    const x = 540 + (i - (L - 1) / 2) * step;
    const t = el('text', { x, y: 1580, 'text-anchor': 'middle', 'font-size': fs, fill: COLORS[i % 6], stroke: '#fff', 'stroke-width': 10, 'paint-order': 'stroke' }, $('word'));
    t.textContent = ch; return { t, x };
  });
  const sparkles = Array.from({ length: 18 }, (_, i) => {
    const a = i * 2.39996, d = 380 + (i * 47) % 140;
    const g = el('path', { d: 'M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z', fill: COLORS[i % 6] }, $('sparkles'));
    return { g, x: 540 + Math.cos(a) * d, y: 920 + Math.sin(a) * d, delay: (i % 6) * 0.12 };
  });
  $('ask').textContent = `Can you count to ${topic.word.toLowerCase()}?`;
  const many = `${n} ${topic.objectName}!`;
  S = { topic, strokes, objects, letters, clouds, sparkles, t1a: "Let's count to", t2a: topic.word + '!', t1b: 'We counted', t2b: many,
    fs2a: Math.min(150, 980 / ((topic.word.length + 1) * 0.62)), fs2b: Math.min(130, 980 / (many.length * 0.6)) };
  window.TIMELINE = { ...T, n, letters: L, pops: objects.map((_, i) => T.count + i * T.countGap), template: 'count' };
  render(0);
  return window.TIMELINE;
}

function strokePoint(dk) {
  const s = S.strokes.find(s => dk <= s.b) || S.strokes[S.strokes.length - 1];
  const p = s.p.getPointAtLength(s.len * clamp((dk - s.a) / (s.b - s.a)));
  return { x: NX + p.x * NS_, y: NY + p.y * NS_ };
}

function render(t) {
  S.clouds.forEach((c, i) => c.g.setAttribute('transform', `translate(${c.x + Math.sin(t * 0.4 + i) * 25} ${c.y}) scale(${c.s})`));
  const showResult = t >= T.result && t < T.word - 0.1;
  $('t1').textContent = showResult ? S.t1b : S.t1a;
  $('t2').textContent = showResult ? S.t2b : S.t2a;
  $('t2').setAttribute('font-size', showResult ? S.fs2b : S.fs2a);
  $('t2').setAttribute('fill', showResult ? '#FF9F1C' : '#2EC4B6');
  const pop2 = showResult ? easeBack(prog(t, T.result, T.result + 0.5))
    : t >= T.word - 0.1 ? easeBack(prog(t, T.word - 0.1, T.word + 0.4)) : easeBack(prog(t, T.titleIn + 0.25, T.titleIn + 0.95));
  $('t1').setAttribute('transform', `translate(540 250) scale(${easeBack(prog(t, T.titleIn, T.titleIn + 0.7))}) translate(-540 -250)`);
  $('t2').setAttribute('transform', `translate(0 ${Math.sin(t * 2.2) * 6}) translate(540 340) scale(${pop2}) translate(-540 -340)`);

  // numeral drawing, then colour pop and gentle bounce
  const dk = easeInOut(prog(t, ...T.draw));
  S.strokes.forEach(s => s.p.setAttribute('stroke-dashoffset', s.len * (1 - clamp((dk - s.a) / (s.b - s.a)))));
  const ck = easeBack(prog(t, T.color, T.color + 0.5));
  $('numColor').setAttribute('opacity', clamp(ck));
  const nb = t > T.color + 0.5 ? 1 + Math.sin((t - T.color) * 3) * 0.03 : 1;
  $('num').style.transform = `scale(${nb})`;

  // Penny
  const home = { x: 830, y: 1470 }, away = { x: 900, y: 860 }, start = strokePoint(0);
  let px, py, wiggle = 0;
  if (t < T.pennyToStart[0]) { px = lerp(1250, home.x, easeOut(prog(t, 0.3, 1.1))); py = home.y; wiggle = Math.sin(t * 9) * 10; }
  else if (t < T.draw[0]) { const k = easeInOut(prog(t, ...T.pennyToStart)); px = lerp(home.x, start.x, k); py = lerp(home.y, start.y, k) - Math.sin(k * Math.PI) * 120; }
  else if (t < T.pennyAway[0]) { ({ x: px, y: py } = strokePoint(dk)); wiggle = Math.sin(t * 30) * 3; }
  else {
    const end = strokePoint(1), k = easeInOut(prog(t, ...T.pennyAway));
    px = lerp(end.x, away.x, k); py = lerp(end.y, away.y, k) - Math.sin(k * Math.PI) * 140;
    if (t > T.pennyAway[1]) { py -= Math.abs(Math.sin((t - T.pennyAway[1]) * 4.5)) * 22; wiggle = Math.sin(t * 4.5) * 5; }
  }
  $('penny').setAttribute('transform', `translate(${px} ${py}) scale(0.8)`);
  $('pennyInner').setAttribute('transform', `rotate(${wiggle})`);
  ['pEyeL', 'pEyeR'].forEach(id => $(id).setAttribute('ry', (t % 3.1) > 3.0 ? 1.5 : 10));

  // objects pop in one by one; all hop together on the result
  S.objects.forEach((o, i) => {
    const s = T.count + i * T.countGap, k = easeBack(prog(t, s, s + 0.4));
    const hop = t > T.result ? -Math.abs(Math.sin((t - T.result) * 4 + i * 0.4)) * 14 : 0;
    o.g.style.transform = `translate(0px, ${hop}px) scale(${k})`;
    o.g.style.opacity = k > 0 ? 1 : 0;
  });

  S.letters.forEach(({ t: tx, x }, i) => {
    const s = T.word + i * T.letterGap, k = easeBack(prog(t, s, s + 0.4));
    const hop = t > s + 0.4 ? -Math.abs(Math.sin((t - s) * 3)) * 10 : 0;
    tx.setAttribute('transform', `translate(${x} ${1580 + hop}) scale(${k}) translate(${-x} -1580)`);
    tx.setAttribute('opacity', k > 0 ? 1 : 0);
  });
  const ak = easeBack(prog(t, T.ask, T.ask + 0.6));
  $('ask').setAttribute('opacity', clamp(ak));
  $('ask').setAttribute('transform', `translate(540 1740) scale(${ak}) translate(-540 -1740)`);
  S.sparkles.forEach(sp => {
    const k = prog(t, T.ask + sp.delay, T.ask + sp.delay + 0.8);
    sp.g.setAttribute('transform', `translate(${sp.x} ${sp.y}) scale(${k >= 1 ? 0.75 + Math.sin(t * 6 + sp.x) * 0.25 : easeBack(k)}) rotate(${t * 40})`);
    sp.g.setAttribute('opacity', k > 0 ? 1 : 0);
  });
}
window.setup = setup; window.render = render; window.DURATION = T.end;
setup(new URLSearchParams(location.search).get('topic') || 'count-3');
</script>
</body>
</html>
