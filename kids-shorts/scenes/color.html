<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Fredoka; font-weight: 700; src: url(../node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #FFF6E9; }
  svg { display: block; }
  text { font-family: Fredoka, sans-serif; font-weight: 700; }
  .pop { transform-box: fill-box; transform-origin: center; }
</style>
<script src="../topics.js"></script>
<script src="../characters.js"></script>
</head>
<body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3E8FF"/><stop offset="0.55" stop-color="#FFF4E4"/><stop offset="1" stop-color="#E8F4FF"/>
    </linearGradient>
    <filter id="mono"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope="0.35" intercept="0.62"/><feFuncG type="linear" slope="0.35" intercept="0.62"/><feFuncB type="linear" slope="0.35" intercept="0.62"/></feComponentTransfer></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5A3A7A" flood-opacity="0.18"/></filter>
    <pattern id="dots" width="60" height="60" patternUnits="userSpaceOnUse"><circle cx="30" cy="30" r="3" fill="#E6DAF0"/></pattern>
    <clipPath id="wipe"><rect id="wipeRect" x="0" y="0" width="0" height="1920"/></clipPath>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <g id="clouds"></g>
  <g filter="url(#soft)"><rect x="90" y="470" width="900" height="900" rx="64" fill="#FFFDF8"/></g>
  <rect x="90" y="470" width="900" height="900" rx="64" fill="url(#dots)" opacity="0.55"/>
  <g id="splat"></g>

  <text id="t1" x="540" y="250" text-anchor="middle" font-size="72" fill="#5B4A7A"></text>
  <text id="t2" x="540" y="385" text-anchor="middle" font-size="150" stroke="#3B2B4F" stroke-width="6" paint-order="stroke"></text>

  <g id="mainWrap" transform="translate(540 880) scale(0.68)"><g id="main" class="pop"><g id="grey" filter="url(#mono)"></g><g id="colored" clip-path="url(#wipe)"></g></g></g>
  <g id="extras"></g>
  <g id="word"></g>
  <text id="ask" x="540" y="1770" text-anchor="middle" font-size="80" fill="#5B4A7A" opacity="0"></text>
  <g id="sparkles"></g>
  <g id="coco"></g>
</svg>

<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const easeInOut = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeBack = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const FACE = (mouth = true) => `<ellipse cx="-150" cy="60" rx="46" ry="30" fill="#FF8FA3" opacity="0.75"/><ellipse cx="150" cy="60" rx="46" ry="30" fill="#FF8FA3" opacity="0.75"/>
<g transform="translate(-95 -40)"><ellipse rx="34" ry="44" fill="#3B2B4F"/><circle cx="10" cy="-14" r="11" fill="#fff"/></g>
<g transform="translate(95 -40)"><ellipse rx="34" ry="44" fill="#3B2B4F"/><circle cx="10" cy="-14" r="11" fill="#fff"/></g>` + (mouth ? '<path d="M -90 70 Q 0 160 90 70" fill="none" stroke="#3B2B4F" stroke-width="18" stroke-linecap="round"/>' : '');

// Timeline (s): Coco arrives, colours the grey object, then two more things of the same colour.
const T = { titleIn: 0.2, cocoIn: [0.5, 1.3], show: 1.4, cocoToArt: [2.4, 3.0], colour: [3.0, 6.0], cocoBack: [6.0, 6.7],
  done: 6.1, aColour: 6.4, extras: [8.4, 10.3], word: 12.6, letterGap: 0.5, ask: 16.4, end: 20 };
const ART_X = 540, ART_Y = 880, ART_S = 0.68, HALF = 320 * ART_S;
const REST = { x: 935, y: 1440 };
let S = null;

function artOf(key) {
  const t = window.TOPICS.find(t => t.id === key);
  return t.artData || (t.art ? artOf(t.art) : t);
}
function drawArt(art, parent) {
  for (const layer of ['back', 'fill', 'front']) for (const [tag, attrs] of (art[layer] || [])) el(tag, attrs, parent);
  if (art.face) { const f = el('g', { transform: `translate(${art.face.x || 0} ${art.face.y}) scale(${art.face.s})` }, parent); f.innerHTML = FACE(art.face.mouth !== false); }
  if (art.strokes && !art.template) el('path', { d: art.strokes[0], fill: 'none', stroke: '#3B2B4F', 'stroke-width': 22, 'stroke-linejoin': 'round' }, parent);
}

function setup(topicId) {
  const topic = window.TOPICS.find(t => t.id === topicId) || window.TOPICS.find(t => t.template === 'color');
  T.letterGap = Math.min(0.5, 3.0 / topic.word.length);
  T.extras = topic.extras.map((_, i) => 8.4 + i * 1.9);
  for (const id of ['grey', 'colored', 'extras', 'word', 'clouds', 'sparkles', 'splat']) $(id).innerHTML = '';
  const art = artOf(topic.main);
  drawArt(art, $('grey')); drawArt(art, $('colored'));
  // soft colour splash behind the card centre once coloured
  el('circle', { cx: 540, cy: 900, r: 380, fill: topic.hex, opacity: 0.0, id: 'splatC' }, $('splat'));
  const extras = topic.extras.map(([key], i) => {
    const g = el('g', { class: 'pop' }, $('extras'));
    const inner = el('g', { transform: `translate(${i ? 690 : 290} 1225) scale(0.27)` }, g);
    drawArt(artOf(key), inner);
    return g;
  });
  const clouds = [[180, 140, 1.0], [880, 90, 0.8], [700, 1500, 0.6], [100, 1620, 0.8]].map(([x, y, s]) => {
    const g = el('g', {}, $('clouds'));
    for (const [dx, dy, r] of [[0, 0, 50], [55, -20, 62], [115, 0, 48], [58, 18, 50]]) el('circle', { cx: dx, cy: dy, r, fill: '#FFFFFF', opacity: 0.85 }, g);
    return { g, x, y, s };
  });
  const L = topic.word.length, step = Math.min(125, 940 / L), fs = Math.min(160, step * 1.3);
  const letters = topic.word.split('').map((ch, i) => {
    const x = 540 + (i - (L - 1) / 2) * step;
    const t = el('text', { x, y: 1590, 'text-anchor': 'middle', 'font-size': fs, fill: topic.hex, stroke: '#3B2B4F', 'stroke-width': 6, 'paint-order': 'stroke' }, $('word'));
    t.textContent = ch; return { t, x };
  });
  const sparkles = Array.from({ length: 18 }, (_, i) => {
    const a = i * 2.39996, d = 360 + (i * 47) % 140;
    const g = el('path', { d: 'M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z', fill: i % 2 ? topic.hex : '#FFD23F', stroke: '#3B2B4F', 'stroke-width': 3 }, $('sparkles'));
    return { g, x: 540 + Math.cos(a) * d, y: 880 + Math.sin(a) * d, delay: (i % 6) * 0.1 };
  });
  $('t2').setAttribute('fill', topic.hex);
  $('ask').textContent = `What else is ${topic.word.toLowerCase()}?`;
  const thing = `${topic.word} ${topic.mainName.toUpperCase()}!`;
  S = { topic, extras, letters, clouds, sparkles, t1a: "Let's learn", t2a: topic.word + '!', t1b: topic.word === 'ORANGE' ? 'An orange' : 'A ' + topic.word.toLowerCase(), t2b: topic.mainName.toUpperCase() + '!',
    fs2a: Math.min(150, 980 / ((topic.word.length + 1) * 0.62)), fs2b: Math.min(150, 980 / ((topic.mainName.length + 1) * 0.62)) };
  window.TIMELINE = { ...T, letters: L, template: 'color' };
  render(0);
  return window.TIMELINE;
}

function render(t) {
  S.clouds.forEach((c, i) => c.g.setAttribute('transform', `translate(${c.x + Math.sin(t * 0.4 + i) * 25} ${c.y}) scale(${c.s})`));
  const showThing = t >= T.aColour && t < T.word - 0.1;
  $('t1').textContent = showThing ? S.t1b : S.t1a;
  $('t2').textContent = showThing ? S.t2b : S.t2a;
  $('t2').setAttribute('font-size', showThing ? S.fs2b : S.fs2a);
  const pop = showThing ? easeBack(prog(t, T.aColour, T.aColour + 0.5)) : t >= T.word - 0.1 ? easeBack(prog(t, T.word - 0.1, T.word + 0.4)) : easeBack(prog(t, T.titleIn, T.titleIn + 0.7));
  $('t1').setAttribute('transform', `translate(540 250) scale(${pop}) translate(-540 -250)`);
  $('t2').setAttribute('transform', `translate(0 ${Math.sin(t * 2.2) * 6}) translate(540 340) scale(${pop}) translate(-540 -340)`);

  // grey object pops in; colour wipes in left→right while Coco scribbles
  const sk = easeBack(prog(t, T.show, T.show + 0.5));
  const hop = t > T.done + 0.3 ? -Math.abs(Math.sin((t - T.done) * 3)) * 16 : 0;
  $('main').style.transform = `translate(0px, ${hop}px) scale(${sk})`; $('main').style.opacity = sk > 0 ? 1 : 0;
  const ck = prog(t, ...T.colour);
  $('wipeRect').setAttribute('x', -HALF / ART_S - 20);
  $('wipeRect').setAttribute('y', -400);
  $('wipeRect').setAttribute('width', (2 * HALF / ART_S + 40) * ck);
  $('wipeRect').setAttribute('height', 800);
  $('splatC').setAttribute('opacity', 0.18 * prog(t, T.done, T.done + 0.5));
  $('splatC').setAttribute('r', 380 * easeBack(prog(t, T.done, T.done + 0.6)));

  // Coco: arrive, colour (tip scribbling over the object), go back
  const blink = (t % 3.1) > 3.0 ? 0.15 : 1;
  let x, y, rot = 0, sc = 0.85, tipMode = false;
  if (t < T.cocoToArt[0]) { const k = easeOut(prog(t, ...T.cocoIn)); x = lerp(1250, REST.x, k); y = REST.y - Math.abs(Math.sin(t * 6)) * (k < 1 ? 30 : 6); rot = Math.sin(t * 3) * 3; }
  else if (t < T.colour[1]) {
    tipMode = true;
    const k = t < T.colour[0] ? 0 : ck;
    const tx = ART_X - HALF + 2 * HALF * k, ty = ART_Y + Math.sin(t * 22) * HALF * 0.75;
    if (t < T.colour[0]) { const m = easeInOut(prog(t, ...T.cocoToArt)); x = lerp(REST.x, tx, m); y = lerp(REST.y - 400, ty, m); } else { x = tx; y = ty; }
  } else { const k = easeInOut(prog(t, ...T.cocoBack)); x = lerp(ART_X + HALF, REST.x, k); y = lerp(ART_Y, REST.y, k) - Math.sin(k * Math.PI) * 120; if (k >= 1) y -= Math.abs(Math.sin((t - T.cocoBack[1]) * 4.4)) * 22; rot = Math.sin(t * 4.4) * 4; }
  $('coco').innerHTML = window.CHARACTERS.coco({ blink, color: S.topic.hex === '#F4F4F4' ? '#C9CED6' : S.topic.hex });
  // in tip mode the crayon is upside down with its tip on (x, y)
  $('coco').setAttribute('transform', tipMode ? `translate(${x} ${y}) rotate(${200 + Math.sin(t * 22) * 6}) translate(0 450) scale(0.75)` : `translate(${x} ${y}) rotate(${rot}) scale(${sc})`);

  S.extras.forEach((g, i) => { const k = easeBack(prog(t, T.extras[i], T.extras[i] + 0.45)); const h = t > T.extras[i] + 0.5 ? -Math.abs(Math.sin((t - T.extras[i]) * 3.2)) * 10 : 0; g.style.transform = `translate(0px, ${h}px) scale(${k})`; g.style.opacity = k > 0 ? 1 : 0; });

  S.letters.forEach(({ t: tx, x }, i) => {
    const s = T.word + i * T.letterGap, k = easeBack(prog(t, s, s + 0.4));
    const h = t > s + 0.4 ? -Math.abs(Math.sin((t - s) * 3)) * 10 : 0;
    tx.setAttribute('transform', `translate(${x} ${1590 + h}) scale(${k}) translate(${-x} -1590)`);
    tx.setAttribute('opacity', k > 0 ? 1 : 0);
  });
  const ak = easeBack(prog(t, T.ask, T.ask + 0.6));
  $('ask').setAttribute('opacity', clamp(ak));
  $('ask').setAttribute('transform', `translate(540 1750) scale(${ak}) translate(-540 -1750)`);
  S.sparkles.forEach(sp => {
    const k = prog(t, T.done + sp.delay, T.done + sp.delay + 0.7) * (1 - prog(t, T.done + 2.6, T.done + 3.1));
    sp.g.setAttribute('transform', `translate(${sp.x} ${sp.y}) scale(${easeBack(k)}) rotate(${t * 40})`);
    sp.g.setAttribute('opacity', k > 0 ? 1 : 0);
  });
}
window.setup = setup; window.render = render; window.DURATION = T.end;
setup(new URLSearchParams(location.search).get('topic') || 'color-red');
</script>
</body>
</html>
