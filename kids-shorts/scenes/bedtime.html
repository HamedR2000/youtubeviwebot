<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Bedtime scene (1920x1080): night sky, twinkling stars, a sleepy moon, drifting clouds, and a sleeping friend.
     window.setup({ subject: '<topic id>' | null, text: 'Good night, cow.', hue }) ; window.render(t) -->
<style>
  @font-face { font-family: Fredoka; font-weight: 700; src: url(../node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2); }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #141A3C; }
  svg { display: block; }
  text { font-family: Fredoka, sans-serif; font-weight: 700; }
</style>
<script src="../topics.js"></script>
<script src="../characters.js"></script>
</head>
<body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E1233"/><stop offset="0.6" stop-color="#2A2F6E"/><stop offset="1" stop-color="#4B3F86"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#FFF6C8" stop-opacity="0.55"/><stop offset="1" stop-color="#FFF6C8" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <g id="stars"></g>
  <g id="moon"></g>
  <g id="clouds"></g>
  <path d="M 0 860 C 400 780 800 900 1200 830 C 1500 780 1750 840 1920 810 L 1920 1080 L 0 1080 Z" fill="#26305E"/>
  <path d="M 0 930 C 500 880 900 990 1400 920 C 1650 890 1800 930 1920 910 L 1920 1080 L 0 1080 Z" fill="#1C244C"/>
  <g id="friend"></g>
  <g id="zzz"></g>
  <text id="caption" x="960" y="160" text-anchor="middle" font-size="84" fill="#FFF3C4" opacity="0"></text>
</svg>
<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const SLEEPY = `<path d="M -125 -40 Q -95 -10 -65 -40" fill="none" stroke="#3B2B4F" stroke-width="14" stroke-linecap="round"/>
<path d="M 65 -40 Q 95 -10 125 -40" fill="none" stroke="#3B2B4F" stroke-width="14" stroke-linecap="round"/>
<ellipse cx="-150" cy="40" rx="40" ry="26" fill="#FF8FA3" opacity="0.6"/><ellipse cx="150" cy="40" rx="40" ry="26" fill="#FF8FA3" opacity="0.6"/>
<path d="M -30 70 Q 0 90 30 70" fill="none" stroke="#3B2B4F" stroke-width="12" stroke-linecap="round"/>`;
let S = null;

function drawSleepy(art, parent) {
  for (const layer of ['back', 'fill', 'front']) for (const [tag, attrs] of (art[layer] || [])) el(tag, attrs, parent);
  if (art.face) { const f = el('g', { transform: `translate(${art.face.x || 0} ${art.face.y}) scale(${art.face.s})` }, parent); f.innerHTML = SLEEPY; }
}

function setup(opts = {}) {
  for (const id of ['stars', 'moon', 'clouds', 'friend', 'zzz']) $(id).innerHTML = '';
  const seed = (opts.seed || 7);
  const stars = Array.from({ length: 90 }, (_, i) => {
    const x = (i * 211 + seed * 37) % 1920, y = (i * 97 + seed * 13) % 760, r = 1.5 + (i % 4);
    return { e: el('circle', { cx: x, cy: y, r, fill: '#FFF8D6' }, $('stars')), ph: i * 1.7 };
  });
  // a sleepy crescent moon with a night cap
  $('moon').innerHTML = `<circle cx="1560" cy="230" r="230" fill="url(#glow)"/>
    <g transform="translate(1560 230)"><path d="M 40 -120 A 125 125 0 1 0 40 120 A 100 100 0 1 1 40 -120 Z" fill="#FFE9A0" stroke="#E8C86A" stroke-width="6"/>
    <path d="M -70 -10 Q -55 5 -40 -10" fill="none" stroke="#8A6A2A" stroke-width="7" stroke-linecap="round"/>
    <path d="M -60 40 Q -45 52 -30 40" fill="none" stroke="#8A6A2A" stroke-width="6" stroke-linecap="round"/>
    <path d="M -20 -118 C 40 -200 120 -170 150 -110 L 30 -100 Z" fill="#9B5DE5"/><circle cx="155" cy="-108" r="18" fill="#FFF"/></g>`;
  const clouds = [[200, 300, 1.0, 18], [700, 180, 0.8, 12], [1150, 380, 0.9, 15], [-200, 520, 0.7, 10]].map(([x, y, s, v]) => {
    const g = el('g', { opacity: 0.55 }, $('clouds'));
    for (const [dx, dy, r] of [[0, 0, 60], [70, -25, 75], [145, 0, 58], [72, 22, 60]]) el('circle', { cx: dx, cy: dy, r, fill: '#6C6FB8' }, g);
    return { g, x, y, s, v };
  });
  // the sleeping friend on a little pillow, under a blanket
  let friend = null;
  if (opts.subject) {
    const t = window.TOPICS.find(x => x.id === opts.subject);
    const art = t && (t.artData || t);
    const g = el('g', {}, $('friend'));
    el('ellipse', { cx: 0, cy: 230, rx: 360, ry: 70, fill: '#8FA8FF', opacity: 0.9 }, g);
    const a = el('g', { transform: 'scale(0.75)' }, g); if (art) drawSleepy(art, a);
    el('path', { d: 'M -330 150 C -200 90 200 90 330 150 L 340 250 C 200 290 -200 290 -340 250 Z', fill: '#F7A8C4', stroke: '#3B2B4F', 'stroke-width': 10 }, g);
    for (let k = -2; k <= 2; k++) el('circle', { cx: k * 120, cy: 210, r: 14, fill: '#FFF3C4' }, g);
    friend = g;
  }
  if (opts.pals) { // Penny, Ellie and Coco asleep on one big pillow
    const g = el('g', {}, $('friend')), C = window.CHARACTERS;
    el('ellipse', { cx: 0, cy: 40, rx: 520, ry: 80, fill: '#8FA8FF', opacity: 0.9 }, g);
    g.innerHTML += `<g transform="translate(-300 85) rotate(-14) scale(0.72)">${C.penny({ blink: 0.08 })}</g>
      <g transform="translate(0 70) scale(0.8)">${C.ellie({ blink: 0.08 })}</g>
      <g transform="translate(300 60) rotate(14) scale(0.72)">${C.coco({ blink: 0.08 })}</g>`;
    el('path', { d: 'M -500 10 C -300 -20 300 -20 500 10 L 510 110 C 300 150 -300 150 -510 110 Z', fill: '#B8A6F2', stroke: '#3B2B4F', 'stroke-width': 10 }, g);
    for (let k = -4; k <= 4; k++) el('path', { transform: `translate(${k * 105} 70) scale(0.6)`, d: 'M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z', fill: '#FFF3C4' }, g);
    friend = g;
  }
  const zzz = ['z', 'z', 'Z'].map((c, i) => { const t = el('text', { 'font-size': 50 + i * 22, fill: '#CFE0FF' }, $('zzz')); t.textContent = c; return t; });
  $('caption').textContent = opts.text || '';
  S = { stars, clouds, friend, zzz, caption: !!opts.text, pals: !!opts.pals };
  render(0);
}

function render(t) {
  S.stars.forEach(s => s.e.setAttribute('opacity', 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 0.9 + s.ph))));
  S.clouds.forEach(c => c.g.setAttribute('transform', `translate(${((c.x + t * c.v) % 2300) - 200} ${c.y}) scale(${c.s})`));
  $('moon').setAttribute('transform', `translate(0 ${Math.sin(t * 0.3) * 8}) rotate(${Math.sin(t * 0.25) * 3} 1560 230)`);
  if (S.friend) {
    const breathe = 1 + Math.sin(t * 1.6) * 0.012;
    S.friend.setAttribute('transform', `translate(960 ${S.pals ? 760 : 640}) scale(${breathe} ${2 - breathe})`);
  }
  S.zzz.forEach((z, i) => {
    const k = ((t * 0.35 + i / 3) % 1);
    z.setAttribute('x', (S.pals ? 1300 : 1180) + k * 160 + i * 20); z.setAttribute('y', (S.pals ? 640 : 520) - k * 260 - i * 30);
    z.setAttribute('opacity', S.friend ? Math.sin(k * Math.PI) * 0.9 : 0);
  });
  $('caption').setAttribute('opacity', S.caption ? clamp(t / 1.5) * clamp((19 - t) / 1.5) : 0);
}
window.setup = setup; window.render = render;
setup({ subject: new URLSearchParams(location.search).get('subject') || 'animal-cow', text: 'Good night, cow.' });
</script>
</body>
</html>
