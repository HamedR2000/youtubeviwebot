<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Fredoka; font-weight: 600; src: url(../node_modules/@fontsource/fredoka/files/fredoka-latin-600-normal.woff2); }
  @font-face { font-family: Fredoka; font-weight: 700; src: url(../node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #FFF6E9; }
  svg { display: block; }
  text { font-family: Fredoka, sans-serif; font-weight: 700; }
</style>
</head>
<body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DDF0FF"/>
      <stop offset="0.55" stop-color="#FFF4E4"/>
      <stop offset="1" stop-color="#FFE3EC"/>
    </linearGradient>
    <radialGradient id="sunFill" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FFE873"/>
      <stop offset="1" stop-color="#FFB627"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7A5A3A" flood-opacity="0.18"/>
    </filter>
    <pattern id="dots" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="3" fill="#E9D9C6"/>
    </pattern>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <g id="clouds"></g>

  <!-- sketchbook card -->
  <g filter="url(#soft)">
    <rect x="90" y="470" width="900" height="900" rx="64" fill="#FFFDF8"/>
  </g>
  <rect x="90" y="470" width="900" height="900" rx="64" fill="url(#dots)" opacity="0.55"/>

  <!-- title -->
  <g id="title">
    <text id="t1" x="540" y="250" text-anchor="middle" font-size="76" fill="#5B4A7A">Let's draw a</text>
    <text id="t2" x="540" y="385" text-anchor="middle" font-size="150" fill="#FF7A59" stroke="#FFFFFF" stroke-width="10" paint-order="stroke">CIRCLE!</text>
  </g>

  <!-- sun rays -->
  <g id="rays" transform="translate(540 920)"></g>

  <!-- circle fill + face -->
  <g id="sun" transform="translate(540 920)">
    <circle id="fill" r="290" fill="url(#sunFill)"/>
    <g id="face">
      <ellipse id="cheekL" cx="-150" cy="60" rx="46" ry="30" fill="#FF8FA3" opacity="0.75"/>
      <ellipse id="cheekR" cx="150" cy="60" rx="46" ry="30" fill="#FF8FA3" opacity="0.75"/>
      <g id="eyeL" transform="translate(-95 -40)">
        <ellipse rx="34" ry="44" fill="#3B2B4F"/><circle cx="10" cy="-14" r="11" fill="#fff"/>
      </g>
      <g id="eyeR" transform="translate(95 -40)">
        <ellipse rx="34" ry="44" fill="#3B2B4F"/><circle cx="10" cy="-14" r="11" fill="#fff"/>
      </g>
      <path id="smile" d="M -90 70 Q 0 160 90 70" fill="none" stroke="#3B2B4F" stroke-width="18" stroke-linecap="round"/>
    </g>
  </g>

  <!-- drawn outline (starts at top, clockwise) -->
  <path id="outline" d="M 540 630 A 290 290 0 1 1 539.99 630" fill="none" stroke="#3B2B4F" stroke-width="22" stroke-linecap="round"/>

  <!-- word -->
  <g id="word"></g>
  <text id="ask" x="540" y="1760" text-anchor="middle" font-size="84" fill="#5B4A7A" opacity="0">Can YOU draw one?</text>
  <g id="sparkles"></g>

  <!-- Penny the Pencil: tip at (0,0) -->
  <g id="penny">
    <g id="pennyInner">
      <g transform="rotate(28)">
        <path d="M 0 0 L -36 -95 L 36 -95 Z" fill="#F7D2A6"/>
        <path d="M 0 0 L -12 -32 L 12 -32 Z" fill="#3B2B4F"/>
        <rect x="-38" y="-370" width="76" height="278" rx="8" fill="#FFC93C"/>
        <rect x="-38" y="-370" width="22" height="278" fill="#FFB020" opacity="0.6"/>
        <rect x="-40" y="-400" width="80" height="34" rx="6" fill="#C9CED6"/>
        <rect x="-40" y="-452" width="80" height="58" rx="22" fill="#FF8FA3"/>
        <g id="pennyFace">
          <ellipse id="pEyeL" cx="-14" cy="-262" rx="7" ry="10" fill="#3B2B4F"/>
          <ellipse id="pEyeR" cx="16" cy="-262" rx="7" ry="10" fill="#3B2B4F"/>
          <path d="M -14 -236 Q 1 -220 16 -236" fill="none" stroke="#3B2B4F" stroke-width="6" stroke-linecap="round"/>
          <ellipse cx="-26" cy="-240" rx="8" ry="5" fill="#FF8FA3" opacity="0.8"/>
          <ellipse cx="28" cy="-240" rx="8" ry="5" fill="#FF8FA3" opacity="0.8"/>
        </g>
      </g>
    </g>
  </g>
</svg>

<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const easeInOut = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeBack = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };

// ---- timeline (seconds) — keep in sync with audio/music.py ----
const T = {
  titleIn: 0.2, pennyToStart: [1.4, 2.2], draw: [2.2, 6.4], pennyAway: [6.4, 7.2],
  fill: 7.0, face: 8.0, rays: 9.4, word: 12.6, letterGap: 0.5, ask: 16.4, end: 20,
};
const CX = 540, CY = 920, R = 290;

// clouds
const clouds = [[180, 140, 1.0], [880, 90, 0.8], [700, 1500, 0.7], [120, 1650, 0.9]].map(([x, y, s]) => {
  const g = el('g', {}, $('clouds'));
  for (const [dx, dy, r] of [[0, 0, 50], [55, -20, 62], [115, 0, 48], [58, 18, 50]]) el('circle', { cx: dx, cy: dy, r, fill: '#FFFFFF', opacity: 0.85 }, g);
  return { g, x, y, s };
});

// rays
const rays = [];
for (let i = 0; i < 12; i++) {
  const g = el('g', { transform: `rotate(${i * 30})` }, $('rays'));
  rays.push(el('rect', { x: -16, y: -440, width: 32, height: 90, rx: 16, fill: i % 2 ? '#FFB627' : '#FF9F1C' }, g));
}

// word letters
const COLORS = ['#FF6B6B', '#FF9F1C', '#2EC4B6', '#4D96FF', '#9B5DE5', '#F15BB5'];
const letters = 'CIRCLE'.split('').map((ch, i) => {
  const x = 540 + (i - 2.5) * 125;
  const t = el('text', { x, y: 1580, 'text-anchor': 'middle', 'font-size': 160, fill: COLORS[i], stroke: '#fff', 'stroke-width': 10, 'paint-order': 'stroke' }, $('word'));
  t.textContent = ch;
  return { t, x };
});

// sparkles (deterministic)
const sparkles = Array.from({ length: 18 }, (_, i) => {
  const a = i * 2.39996, d = 380 + (i * 47) % 140;
  const g = el('path', { d: 'M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z', fill: COLORS[i % 6] }, $('sparkles'));
  return { g, x: CX + Math.cos(a) * d, y: CY + Math.sin(a) * d, delay: (i % 6) * 0.12 };
});

const outline = $('outline');
const LEN = outline.getTotalLength();
outline.setAttribute('stroke-dasharray', LEN);

function render(t) {
  // drifting clouds
  clouds.forEach((c, i) => c.g.setAttribute('transform', `translate(${c.x + Math.sin(t * 0.4 + i) * 25} ${c.y}) scale(${c.s})`));

  // title: pop in, gentle bob
  const tk = easeBack(prog(t, T.titleIn, T.titleIn + 0.7));
  const bob = Math.sin(t * 2.2) * 6;
  $('t1').setAttribute('transform', `translate(540 250) scale(${tk}) translate(-540 -250)`);
  $('t2').setAttribute('transform', `translate(0 ${bob}) translate(540 340) scale(${easeBack(prog(t, T.titleIn + 0.25, T.titleIn + 0.95))}) translate(-540 -340)`);

  // outline drawing
  const dk = easeInOut(prog(t, ...T.draw));
  outline.setAttribute('stroke-dashoffset', LEN * (1 - dk));

  // Penny position
  const home = { x: 830, y: 1470 }, away = { x: 815, y: 1380 };
  let px, py, wiggle = 0;
  if (t < T.pennyToStart[0]) {
    const k = easeOut(prog(t, 0.3, 1.1));
    px = lerp(1250, home.x, k); py = home.y; wiggle = Math.sin(t * 9) * 10; // wave hello
  } else if (t < T.draw[0]) {
    const k = easeInOut(prog(t, ...T.pennyToStart));
    px = lerp(home.x, CX, k); py = lerp(home.y, CY - R, k) - Math.sin(k * Math.PI) * 120;
  } else if (t < T.pennyAway[0]) {
    const p = outline.getPointAtLength(LEN * dk); px = p.x; py = p.y; wiggle = Math.sin(t * 30) * 3;
  } else {
    const k = easeInOut(prog(t, ...T.pennyAway));
    px = lerp(CX, away.x, k); py = lerp(CY - R, away.y, k) - Math.sin(k * Math.PI) * 160;
    if (t > T.pennyAway[1]) { py += -Math.abs(Math.sin((t - T.pennyAway[1]) * 4.5)) * 26; wiggle = Math.sin(t * 4.5) * 5; }
  }
  $('penny').setAttribute('transform', `translate(${px} ${py})`);
  $('pennyInner').setAttribute('transform', `rotate(${wiggle})`);
  const pBlink = (t % 3.1) > 3.0 ? 0.15 : 1;
  ['pEyeL', 'pEyeR'].forEach(id => $(id).setAttribute('ry', 10 * pBlink));

  // fill pop
  const fk = easeBack(prog(t, T.fill, T.fill + 0.55));
  $('fill').setAttribute('transform', `scale(${fk})`);
  $('fill').setAttribute('opacity', prog(t, T.fill, T.fill + 0.1));

  // face
  const fa = easeBack(prog(t, T.face, T.face + 0.5));
  $('face').setAttribute('transform', `scale(${fa})`);
  const blink = (t > 10 && ((t - 10) % 2.6) < 0.12) ? 0.12 : 1;
  ['eyeL', 'eyeR'].forEach((id, i) => $(id).setAttribute('transform', `translate(${i ? 95 : -95} -40) scale(1 ${blink})`));

  // sun squash/bob after face
  const sb = t > T.face + 0.5 ? Math.sin((t - T.face) * 3) * 0.025 : 0;
  $('sun').setAttribute('transform', `translate(${CX} ${CY}) scale(${1 + sb} ${1 - sb})`);

  // rays grow + slow spin
  rays.forEach((r, i) => {
    const k = easeBack(prog(t, T.rays + i * 0.05, T.rays + i * 0.05 + 0.4));
    r.setAttribute('transform', `translate(0 ${(1 - k) * 90}) scale(1 ${k})`);
    r.setAttribute('opacity', k > 0 ? 1 : 0);
  });
  $('rays').setAttribute('transform', `translate(${CX} ${CY}) rotate(${Math.max(0, t - T.rays) * 8})`);

  // title morph: "It's a SUN!" moment between rays and word
  const sunMsg = prog(t, T.rays + 0.6, T.rays + 0.9) * (1 - prog(t, T.word - 0.4, T.word - 0.1));
  $('t1').textContent = sunMsg > 0 ? 'Circle becomes a...' : "Let's draw a";
  $('t2').textContent = sunMsg > 0 ? 'SUN!' : 'CIRCLE!';
  $('t2').setAttribute('fill', sunMsg > 0 ? '#FF9F1C' : '#FF7A59');
  if (t > T.rays + 0.6 && t < T.rays + 1.2) {
    const k = easeBack(prog(t, T.rays + 0.6, T.rays + 1.1));
    $('t2').setAttribute('transform', `translate(540 340) scale(${k}) translate(-540 -340)`);
  }
  if (t >= T.word - 0.1) { $('t1').textContent = "Let's draw a"; $('t2').textContent = 'CIRCLE!'; $('t2').setAttribute('fill', '#FF7A59'); }

  // spell C-I-R-C-L-E
  letters.forEach(({ t: tx, x }, i) => {
    const s = T.word + i * T.letterGap;
    const k = easeBack(prog(t, s, s + 0.4));
    const hop = t > s + 0.4 ? -Math.abs(Math.sin((t - s) * 3)) * 10 : 0;
    tx.setAttribute('transform', `translate(${x} ${1580 + hop}) scale(${k}) translate(${-x} -1580)`);
    tx.setAttribute('opacity', k > 0 ? 1 : 0);
  });

  // ask + sparkles
  const ak = easeBack(prog(t, T.ask, T.ask + 0.6));
  $('ask').setAttribute('opacity', clamp(ak));
  $('ask').setAttribute('transform', `translate(540 1740) scale(${ak}) translate(-540 -1740)`);
  sparkles.forEach(sp => {
    const k = prog(t, T.ask + sp.delay, T.ask + sp.delay + 0.8);
    const tw = k >= 1 ? 0.75 + Math.sin(t * 6 + sp.x) * 0.25 : easeBack(k);
    sp.g.setAttribute('transform', `translate(${sp.x} ${sp.y}) scale(${tw}) rotate(${t * 40})`);
    sp.g.setAttribute('opacity', k > 0 ? 1 : 0);
  });

  // fade to white at the very end for a clean loop
  document.body.style.opacity = 1;
}
window.render = render;
window.DURATION = T.end;
render(0);
</script>
</body>
</html>
