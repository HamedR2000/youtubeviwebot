<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- "Let's Draw" Short: Penny draws an animal or thing step by step, Coco colours it, then we spell the word. -->
<style>
  @font-face { font-family: Fredoka; font-weight: 700; src: url(../node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #FFF6E9; }
  svg { display: block; }
  text { font-family: Fredoka, sans-serif; font-weight: 700; }
</style>
<script src="../topics.js"></script>
<script src="../characters.js"></script>
</head>
<body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF0F6"/><stop offset="0.55" stop-color="#FFF7E6"/><stop offset="1" stop-color="#E9F3FF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7A5A3A" flood-opacity="0.18"/></filter>
    <pattern id="dots" width="60" height="60" patternUnits="userSpaceOnUse"><circle cx="30" cy="30" r="3" fill="#EADCCB"/></pattern>
    <clipPath id="wipe"><rect id="wipeRect" x="0" y="0" width="0" height="1920"/></clipPath>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <g id="clouds"></g>
  <g filter="url(#soft)"><rect x="90" y="470" width="900" height="900" rx="64" fill="#FFFDF8"/></g>
  <rect x="90" y="470" width="900" height="900" rx="64" fill="url(#dots)" opacity="0.55"/>

  <text id="t1" x="540" y="250" text-anchor="middle" font-size="72" fill="#5B4A7A"></text>
  <text id="t2" x="540" y="385" text-anchor="middle" font-size="140" fill="#F15BB5" stroke="#FFFFFF" stroke-width="10" paint-order="stroke"></text>

  <g id="art" transform="translate(540 920) scale(1.2)">
    <g clip-path="url(#wipeClip)"><g id="fills"></g></g>
    <g id="strokes"></g>
  </g>
  <g id="steps"></g>
  <g id="word"></g>
  <text id="ask" x="540" y="1760" text-anchor="middle" font-size="76" fill="#5B4A7A" opacity="0"></text>
  <g id="sparkles"></g>
  <g id="coco"></g>
  <g id="penny"><g id="pennyInner"></g></g>
</svg>

<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const easeInOut = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeBack = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const COLORS = ['#FF6B6B', '#FF9F1C', '#2EC4B6', '#4D96FF', '#9B5DE5', '#F15BB5'];
const AX = 540, AY = 920, AS = 1.2; // art centre and scale

const STEP = 3.2, DRAW = 2.1; // seconds per step, of which drawing
const T = { titleIn: 0.2, steps0: 2.4, letterGap: 0.5 };
let S = null;

function setup(topicId) {
  const topic = window.TOPICS.find(t => t.id === topicId) || window.TOPICS.find(t => t.template === 'drawalong');
  for (const id of ['fills', 'strokes', 'steps', 'word', 'clouds', 'sparkles']) $(id).innerHTML = '';
  const n = topic.steps.length;
  T.stepAt = topic.steps.map((_, i) => T.steps0 + i * STEP);
  T.draw = [T.steps0, T.steps0 + (n - 1) * STEP + DRAW];
  T.colour = [T.steps0 + n * STEP, T.steps0 + n * STEP + 2.2];
  T.done = T.colour[1] + 0.1;
  T.letterGap = Math.min(0.5, 3.0 / topic.word.length);
  T.word = T.done + 1.9;
  T.ask = T.word + topic.word.length * T.letterGap + 1.0;
  T.end = T.ask + 3.4;

  // fills (coloured in by Coco at the end), under the strokes
  if (!$('wipeClip')) { const c = el('clipPath', { id: 'wipeClip' }, document.querySelector('defs')); el('rect', { id: 'wipeR', x: -540, y: -600, width: 0, height: 1200 }, c); }
  for (const [d, fill] of topic.fills) el('path', { d, fill }, $('fills'));
  // strokes, grouped per step; each path is drawn in turn within its step
  const steps = topic.steps.map((stp, i) => {
    const paths = stp.paths.map(d => {
      const p = el('path', { d, fill: 'none', stroke: '#3B2B4F', 'stroke-width': stp.w || 16, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, $('strokes'));
      const len = p.getTotalLength(); p.setAttribute('stroke-dasharray', `${len} ${len + 10}`); p.setAttribute('stroke-dashoffset', len);
      return { p, len };
    });
    const total = paths.reduce((a, s) => a + s.len, 0) || 1; let acc = 0;
    paths.forEach(s => { s.a = acc / total; acc += s.len; s.b = acc / total; });
    return { paths, at: T.stepAt[i] };
  });
  // step caption chips under the card
  const chips = topic.steps.map((stp, i) => {
    const g = el('g', {}, $('steps'));
    el('circle', { cx: 0, cy: -22, r: 44, fill: COLORS[i % 6] }, g);
    const num = el('text', { x: 0, y: -4, 'text-anchor': 'middle', 'font-size': 54, fill: '#fff' }, g); num.textContent = i + 1;
    const lab = el('text', { x: 66, y: -2, 'font-size': 66, fill: '#5B4A7A' }, g); lab.textContent = stp.show;
    return { g, w: 66 + stp.show.length * 33 };
  });
  const clouds = [[180, 140, 1.0], [880, 90, 0.8], [760, 1520, 0.7], [120, 1680, 0.9]].map(([x, y, s]) => {
    const g = el('g', {}, $('clouds'));
    for (const [dx, dy, r] of [[0, 0, 50], [55, -20, 62], [115, 0, 48], [58, 18, 50]]) el('circle', { cx: dx, cy: dy, r, fill: '#FFFFFF', opacity: 0.85 }, g);
    return { g, x, y, s };
  });
  const L = topic.word.length, step = Math.min(125, 940 / L), fs = Math.min(160, step * 1.3);
  const letters = topic.word.split('').map((ch, i) => {
    const x = 540 + (i - (L - 1) / 2) * step;
    const t = el('text', { x, y: 1560, 'text-anchor': 'middle', 'font-size': fs, fill: COLORS[i % 6], stroke: '#fff', 'stroke-width': 10, 'paint-order': 'stroke' }, $('word'));
    t.textContent = ch; return { t, x };
  });
  const sparkles = Array.from({ length: 18 }, (_, i) => {
    const a = i * 2.39996, d = 380 + (i * 47) % 140;
    const g = el('path', { d: 'M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z', fill: COLORS[i % 6] }, $('sparkles'));
    return { g, x: 540 + Math.cos(a) * d, y: 920 + Math.sin(a) * d, delay: (i % 6) * 0.12 };
  });
  const art = topic.article[0].toUpperCase() + topic.article.slice(1);
  $('ask').textContent = `Now you draw ${topic.article} ${topic.word.toLowerCase()}!`;
  $('pennyInner').innerHTML = `<g transform="rotate(28)">${window.CHARACTERS.penny()}</g>`;
  $('coco').innerHTML = `<g id="cocoInner">${window.CHARACTERS.coco()}</g>`;
  const t2a = `${art} ${topic.word}!`;
  S = { topic, steps, chips, letters, clouds, sparkles, t2a, fs2: Math.min(140, 980 / (t2a.length * 0.62)) };
  window.TIMELINE = { ...T, letters: L, steps: T.stepAt, template: 'drawalong' };
  window.DURATION = T.end;
  render(0);
  return window.TIMELINE;
}

// pencil tip position on the art at time t (follows the stroke being drawn)
function tipAt(t) {
  for (let i = S.steps.length - 1; i >= 0; i--) {
    const s = S.steps[i];
    if (t < s.at) continue;
    const k = easeInOut(prog(t, s.at, s.at + DRAW));
    if (k >= 1 && i + 1 < S.steps.length) { // hop to the next step's first point
      const a = pathPoint(s, 1), b = pathPoint(S.steps[i + 1], 0), h = easeInOut(prog(t, s.at + DRAW, S.steps[i + 1].at));
      return { x: lerp(a.x, b.x, h), y: lerp(a.y, b.y, h) - Math.sin(h * Math.PI) * 90, drawing: false };
    }
    return { ...pathPoint(s, k), drawing: k < 1 };
  }
  return null;
}
function pathPoint(s, k) {
  const q = s.paths.find(q => k <= q.b) || s.paths[s.paths.length - 1];
  const p = q.p.getPointAtLength(q.len * clamp((k - q.a) / (q.b - q.a || 1)));
  return { x: AX + p.x * AS, y: AY + p.y * AS };
}

function render(t) {
  S.clouds.forEach((c, i) => c.g.setAttribute('transform', `translate(${c.x + Math.sin(t * 0.4 + i) * 25} ${c.y}) scale(${c.s})`));
  const ta = t >= T.done;
  $('t1').textContent = ta ? 'Ta-da! It\'s' : 'Let\'s draw';
  $('t2').textContent = S.t2a;
  $('t2').setAttribute('font-size', S.fs2);
  $('t1').setAttribute('transform', `translate(540 250) scale(${easeBack(prog(t, T.titleIn, T.titleIn + 0.7))}) translate(-540 -250)`);
  const pop2 = ta ? easeBack(prog(t, T.done, T.done + 0.5)) : easeBack(prog(t, T.titleIn + 0.25, T.titleIn + 0.95));
  $('t2').setAttribute('transform', `translate(0 ${Math.sin(t * 2.2) * 6}) translate(540 340) scale(${pop2}) translate(-540 -340)`);

  // strokes
  S.steps.forEach(s => {
    const k = easeInOut(prog(t, s.at, s.at + DRAW));
    s.paths.forEach(q => q.p.setAttribute('stroke-dashoffset', q.len * (1 - clamp((k - q.a) / (q.b - q.a || 1)))));
  });
  // caption of the current step (until colouring)
  S.chips.forEach((c, i) => {
    const a = T.stepAt[i], b = i + 1 < S.chips.length ? T.stepAt[i + 1] : T.colour[0];
    const k = easeBack(prog(t, a, a + 0.4)), out = prog(t, b - 0.25, b);
    c.g.setAttribute('transform', `translate(${540 - c.w / 2 + 22} 1500) scale(${k * (1 - out)})`);
    c.g.setAttribute('opacity', t >= a && t < b ? 1 : 0);
  });

  // Coco colours it in: a wipe from left to right, Coco riding the edge
  const ck = easeInOut(prog(t, ...T.colour));
  $('wipeR').setAttribute('width', ck * 1080);
  const cx = 90 + ck * 900, cIn = easeOut(prog(t, T.colour[0] - 0.6, T.colour[0])), cOut = easeInOut(prog(t, T.colour[1], T.colour[1] + 0.6));
  $('coco').setAttribute('transform', `translate(${lerp(-200, cx, cIn) + cOut * 600} ${AY + 230 + Math.sin(t * 12) * 12}) rotate(${-25 + Math.sin(t * 10) * 8}) scale(0.55)`);
  $('coco').setAttribute('opacity', t > T.colour[0] - 0.6 && t < T.colour[1] + 0.6 ? 1 : 0);

  // Penny
  const home = { x: 860, y: 1480 }, away = { x: 900, y: 1460 };
  const first = pathPoint(S.steps[0], 0), tip = tipAt(t);
  let px, py, wiggle = 0;
  if (t < 1.4) { px = lerp(1250, home.x, easeOut(prog(t, 0.3, 1.1))); py = home.y; wiggle = Math.sin(t * 9) * 10; }
  else if (t < T.steps0) { const k = easeInOut(prog(t, 1.4, T.steps0)); px = lerp(home.x, first.x, k); py = lerp(home.y, first.y, k) - Math.sin(k * Math.PI) * 120; }
  else if (t < T.draw[1]) { px = tip.x; py = tip.y; wiggle = tip.drawing ? Math.sin(t * 30) * 3 : 0; }
  else {
    const end = pathPoint(S.steps[S.steps.length - 1], 1), k = easeInOut(prog(t, T.draw[1], T.draw[1] + 0.8));
    px = lerp(end.x, away.x, k); py = lerp(end.y, away.y, k) - Math.sin(k * Math.PI) * 140;
    if (k >= 1) { py -= Math.abs(Math.sin((t - T.draw[1]) * 4.5)) * 22; wiggle = Math.sin(t * 4.5) * 5; }
  }
  $('penny').setAttribute('transform', `translate(${px} ${py}) scale(0.8)`);
  $('pennyInner').setAttribute('transform', `rotate(${wiggle})`);

  // the finished drawing does a happy bounce
  const bounce = t > T.done ? 1 + Math.sin((t - T.done) * 3) * 0.025 : 1;
  $('art').setAttribute('transform', `translate(${AX} ${AY}) scale(${AS * bounce})`);

  S.letters.forEach(({ t: tx, x }, i) => {
    const s = T.word + i * T.letterGap, k = easeBack(prog(t, s, s + 0.4));
    const hop = t > s + 0.4 ? -Math.abs(Math.sin((t - s) * 3)) * 10 : 0;
    tx.setAttribute('transform', `translate(${x} ${1560 + hop}) scale(${k}) translate(${-x} -1560)`);
    tx.setAttribute('opacity', k > 0 ? 1 : 0);
  });
  const ak = easeBack(prog(t, T.ask, T.ask + 0.6));
  $('ask').setAttribute('opacity', clamp(ak));
  $('ask').setAttribute('transform', `translate(540 1740) scale(${ak}) translate(-540 -1740)`);
  S.sparkles.forEach(sp => {
    const k = prog(t, T.done + sp.delay, T.done + sp.delay + 0.8);
    sp.g.setAttribute('transform', `translate(${sp.x} ${sp.y}) scale(${k >= 1 ? 0.75 + Math.sin(t * 6 + sp.x) * 0.25 : easeBack(k)}) rotate(${t * 40})`);
    sp.g.setAttribute('opacity', k > 0 ? 1 : 0);
  });
}
window.setup = setup; window.render = render;
setup(new URLSearchParams(location.search).get('topic') || 'drawalong-cat');
</script>
</body>
</html>
