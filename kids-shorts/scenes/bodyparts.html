<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- "This is my nose!" Short: a friendly doodle kid, the body part glows and Penny points at it; "Touch your nose!" -->
<style>
  @font-face { font-family: Fredoka; font-weight: 700; src: url(../node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #FFF6E9; }
  svg { display: block; }
  text { font-family: Fredoka, sans-serif; font-weight: 700; }
</style>
<script src="../topics.js"></script>
<script src="../characters.js"></script>
</head>
<body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4F6FF"/><stop offset="0.55" stop-color="#FFF6E4"/><stop offset="1" stop-color="#FFE9F2"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5A3A7A" flood-opacity="0.18"/></filter>
    <pattern id="dots" width="60" height="60" patternUnits="userSpaceOnUse"><circle cx="30" cy="30" r="3" fill="#E2E2F0"/></pattern>
    <radialGradient id="glow"><stop offset="0.55" stop-color="#FFE45C" stop-opacity="0.75"/><stop offset="1" stop-color="#FFE45C" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <g id="clouds"></g>
  <g filter="url(#soft)"><rect x="90" y="470" width="900" height="980" rx="64" fill="#FFFDF8"/></g>
  <rect x="90" y="470" width="900" height="980" rx="64" fill="url(#dots)" opacity="0.55"/>
  <text id="t1" x="540" y="250" text-anchor="middle" font-size="72" fill="#5B4A7A"></text>
  <text id="t2" x="540" y="385" text-anchor="middle" font-size="140" fill="#2EC4B6" stroke="#FFFFFF" stroke-width="10" paint-order="stroke"></text>
  <g id="glowG"></g>
  <g id="kid" transform="translate(540 960)"></g>
  <g id="arrow"></g>
  <g id="word"></g>
  <text id="ask" x="540" y="1790" text-anchor="middle" font-size="72" fill="#5B4A7A" opacity="0"></text>
  <g id="sparkles"></g>
  <g id="penny"></g>
</svg>
<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const easeInOut = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeBack = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const PAL = ['#FF6B6B', '#FF9F1C', '#2EC4B6', '#4D96FF', '#9B5DE5', '#F15BB5'];
const O = 'stroke="#3B2B4F" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"';

// the doodle kid (origin = middle of the body); part targets are in these coordinates
const KID = `
  <path d="M -95 330 L -110 450 L -40 450 L -30 330 Z" fill="#4D96FF" ${O}/><path d="M 95 330 L 110 450 L 40 450 L 30 330 Z" fill="#4D96FF" ${O}/>
  <ellipse cx="-80" cy="465" rx="62" ry="28" fill="#FF6B6B" ${O}/><ellipse cx="80" cy="465" rx="62" ry="28" fill="#FF6B6B" ${O}/>
  <path d="M -150 60 C -230 120 -250 200 -240 250" fill="none" stroke="#3B2B4F" stroke-width="62" stroke-linecap="round"/><path d="M -150 60 C -230 120 -250 200 -240 250" fill="none" stroke="#FFC9A3" stroke-width="44" stroke-linecap="round"/>
  <path d="M 150 60 C 230 120 250 200 240 250" fill="none" stroke="#3B2B4F" stroke-width="62" stroke-linecap="round"/><path d="M 150 60 C 230 120 250 200 240 250" fill="none" stroke="#FFC9A3" stroke-width="44" stroke-linecap="round"/>
  <g transform="translate(-240 275)"><circle r="42" fill="#FFC9A3" ${O}/><path d="M -30 -20 l -18 -22 M -12 -34 l -6 -28 M 10 -36 l 6 -28 M 28 -24 l 18 -20" ${O} fill="none"/></g>
  <g transform="translate(240 275)"><circle r="42" fill="#FFC9A3" ${O}/><path d="M 30 -20 l 18 -22 M 12 -34 l 6 -28 M -10 -36 l -6 -28 M -28 -24 l -18 -20" ${O} fill="none"/></g>
  <path d="M -160 20 C -160 -30 160 -30 160 20 L 150 340 L -150 340 Z" fill="#FFD23F" ${O}/>
  <circle cx="0" cy="200" r="14" fill="#FF9F1C"/>
  <circle cx="-215" cy="-250" r="46" fill="#FFC9A3" ${O}/><circle cx="215" cy="-250" r="46" fill="#FFC9A3" ${O}/>
  <circle cx="0" cy="-250" r="215" fill="#FFC9A3" ${O}/>
  <path d="M -205 -300 C -220 -480 220 -480 205 -300 C 150 -360 120 -380 60 -360 C 20 -400 -60 -400 -100 -350 C -140 -380 -180 -350 -205 -300 Z" fill="#8B5A3C" ${O}/>
  <g transform="translate(-75 -250)"><ellipse rx="28" ry="36" fill="#3B2B4F"/><circle cx="9" cy="-12" r="10" fill="#fff"/></g>
  <g transform="translate(75 -250)"><ellipse rx="28" ry="36" fill="#3B2B4F"/><circle cx="9" cy="-12" r="10" fill="#fff"/></g>
  <ellipse cx="-130" cy="-180" rx="36" ry="22" fill="#FF8FA3" opacity="0.8"/><ellipse cx="130" cy="-180" rx="36" ry="22" fill="#FF8FA3" opacity="0.8"/>
  <path d="M 0 -215 C 25 -200 25 -170 0 -165" fill="none" ${O}/>
  <path d="M -70 -130 Q 0 -60 70 -130 Z" fill="#E63946" ${O}/><rect x="-40" y="-130" width="80" height="20" fill="#FFFFFF"/>
`;

const T = { titleIn: 0.2, show: 2.6, point: [3.0, 4.4], touch: 7.6, word: 12.6, letterGap: 0.5, ask: 16.4, end: 20 };
let S = null;

function setup(topicId) {
  const topic = window.TOPICS.find(t => t.id === topicId) || window.TOPICS.find(t => t.template === 'bodyparts');
  for (const id of ['kid', 'glowG', 'arrow', 'word', 'clouds', 'sparkles']) $(id).innerHTML = '';
  $('kid').innerHTML = KID;
  const KX = 540, KY = 900, SC = 0.92;
  $('kid').setAttribute('transform', `translate(${KX} ${KY}) scale(${SC})`);
  const spots = topic.spots.map(([x, y, r]) => ({ x: KX + x * SC, y: KY + y * SC, r: r * SC }));
  const glows = spots.map(s => { const g = el('g', {}, $('glowG'));
    el('circle', { cx: s.x, cy: s.y, r: s.r * 1.7, fill: 'url(#glow)' }, g);
    const ring = el('circle', { cx: s.x, cy: s.y, r: s.r * 1.25, fill: 'none', stroke: '#FF4F9A', 'stroke-width': 9, 'stroke-dasharray': '22 14' }, $('arrow'));
    return { g, ring }; });
  // one arrow per spot, pointing in from outside the kid
  const arrows = spots.map(s => { const dir = s.x < 540 ? -1 : s.x > 540 ? 1 : (s.y < 900 ? 1 : -1);
    const g = el('g', {}, $('arrow'));
    g.innerHTML = '<path d="M 0 0 L 70 -40 L 52 -14 L 150 -14 L 150 14 L 52 14 L 70 40 Z" fill="#FF4F9A" stroke="#fff" stroke-width="8" stroke-linejoin="round" paint-order="stroke"/>';
    return { g, s, dir }; });
  const clouds = [[180, 140, 1.0], [880, 90, 0.8], [760, 1560, 0.6], [100, 1620, 0.7]].map(([x, y, s]) => {
    const g = el('g', {}, $('clouds')); for (const [dx, dy, r] of [[0, 0, 50], [55, -20, 62], [115, 0, 48], [58, 18, 50]]) el('circle', { cx: dx, cy: dy, r, fill: '#FFFFFF', opacity: 0.85 }, g); return { g, x, y, s };
  });
  const W = topic.word, L = W.length, step = Math.min(125, 940 / L), fs = Math.min(160, step * 1.3);
  T.letterGap = Math.min(0.5, 3.0 / L);
  const letters = W.split('').map((ch, i) => { const x = 540 + (i - (L - 1) / 2) * step;
    const t = el('text', { x, y: 1600, 'text-anchor': 'middle', 'font-size': fs, fill: PAL[i % 6], stroke: '#fff', 'stroke-width': 10, 'paint-order': 'stroke' }, $('word')); t.textContent = ch; return { t, x }; });
  const sparkles = Array.from({ length: 14 }, (_, i) => { const a = i * 2.39996, d = 380 + (i * 47) % 140;
    const g = el('path', { d: 'M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z', fill: PAL[i % 6] }, $('sparkles')); return { g, x: 540 + Math.cos(a) * d, y: 960 + Math.sin(a) * d, delay: (i % 6) * 0.1 }; });
  $('penny').innerHTML = `<g id="pennyInner">${window.CHARACTERS.penny()}</g>`;
  $('ask').textContent = `Where ${topic.plural ? 'are' : 'is'} your ${topic.word.toLowerCase()}?`;
  const head = `${topic.plural ? 'These are' : 'This is'} my`;
  S = { topic, spots, glows, arrows, clouds, letters, sparkles, head, w2: `${topic.word}!`, fs2: Math.min(140, 980 / ((L + 1) * 0.62)) };
  window.TIMELINE = { ...T, letters: L, template: 'bodyparts' };
  window.DURATION = T.end;
  render(0);
  return window.TIMELINE;
}

function render(t) {
  S.clouds.forEach((c, i) => c.g.setAttribute('transform', `translate(${c.x + Math.sin(t * 0.4 + i) * 25} ${c.y}) scale(${c.s})`));
  const touch = t >= T.touch && t < T.word;
  $('t1').textContent = touch ? 'Touch your' : t >= T.show ? S.head : "Let's learn";
  $('t2').textContent = t >= T.show ? S.w2 : 'MY BODY!';
  $('t2').setAttribute('font-size', t >= T.show ? S.fs2 : 140);
  $('t2').setAttribute('fill', touch ? '#F15BB5' : '#2EC4B6');
  const pop = t >= T.touch ? easeBack(prog(t, T.touch, T.touch + 0.5)) : t >= T.show ? easeBack(prog(t, T.show, T.show + 0.5)) : easeBack(prog(t, T.titleIn, T.titleIn + 0.7));
  $('t1').setAttribute('transform', `translate(540 250) scale(${pop}) translate(-540 -250)`);
  $('t2').setAttribute('transform', `translate(0 ${Math.sin(t * 2.2) * 6}) translate(540 340) scale(${pop}) translate(-540 -340)`);
  // kid wiggles happily; the part glows and pulses
  const wig = Math.sin(t * 2.4) * 2;
  $('kid').setAttribute('transform', `translate(540 900) scale(0.92)`);
  const gk = t >= T.show ? (0.75 + 0.25 * Math.sin(t * 6)) * easeBack(prog(t, T.show, T.show + 0.5)) : 0;
  S.glows.forEach(({ g, ring }) => { g.setAttribute('opacity', clamp(gk)); ring.setAttribute('opacity', clamp(gk)); ring.setAttribute('stroke-dashoffset', -t * 60); });
  S.arrows.forEach(({ g, s, dir }) => {
    const k = easeBack(prog(t, T.point[0], T.point[0] + 0.6)), bob = Math.abs(Math.sin(t * 5)) * 18;
    const ox = s.x + dir * (s.r * 1.3 + 10 + bob);
    g.setAttribute('transform', `translate(${ox} ${s.y}) scale(${dir * k} ${k})`);
    g.setAttribute('opacity', t >= T.point[0] && t < T.word ? 1 : 0);
  });
  // Penny flies in and points at (the first) spot
  const pk = easeInOut(prog(t, 0.4, 1.2));
  $('penny').setAttribute('transform', `translate(${lerp(1250, 930, pk)} ${1470 - Math.abs(Math.sin(t * 3)) * 14}) scale(0.5)`);
  $('pennyInner').setAttribute('transform', `rotate(${Math.sin(t * 3) * 8})`);
  S.letters.forEach(({ t: tx2, x }, i) => { const s = T.word + i * T.letterGap, kk = easeBack(prog(t, s, s + 0.4));
    const hop = t > s + 0.4 ? -Math.abs(Math.sin((t - s) * 3)) * 10 : 0;
    tx2.setAttribute('transform', `translate(${x} ${1600 + hop}) scale(${kk}) translate(${-x} -1600)`); tx2.setAttribute('opacity', kk > 0 ? 1 : 0); });
  const ak = easeBack(prog(t, T.ask, T.ask + 0.6));
  $('ask').setAttribute('opacity', clamp(ak)); $('ask').setAttribute('transform', `translate(540 1770) scale(${ak}) translate(-540 -1770)`);
  S.sparkles.forEach(s2 => { const kk = prog(t, T.touch + s2.delay, T.touch + s2.delay + 0.6);
    s2.g.setAttribute('transform', `translate(${s2.x} ${s2.y}) scale(${kk >= 1 ? 0.6 + Math.sin(t * 6 + s2.x) * 0.2 : easeBack(kk)}) rotate(${t * 40})`); s2.g.setAttribute('opacity', kk > 0 ? 1 : 0); });
}
window.setup = setup; window.render = render;
setup(new URLSearchParams(location.search).get('topic') || 'body-nose');
</script>
</body>
</html>
