<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- 1920x1080 frame for compilation videos. The portrait segment (scaled to 607x1080) is overlaid in the centre window.
     ?mode=seg&title=...&i=3&n=12&word=LION&hue=200   or   ?mode=intro&title=...&sub=...&hue=200 -->
<style>
  @font-face { font-family: Fredoka; font-weight: 700; src: url(../node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2); }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  svg { display: block; }
  text { font-family: Fredoka, sans-serif; font-weight: 700; }
</style>
<script src="../characters.js"></script>
</head>
<body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
const q = new URLSearchParams(location.search);
const mode = q.get('mode') || 'seg', title = q.get('title') || 'Guess the Shadow!', sub = q.get('sub') || '';
const i = Number(q.get('i') || 1), n = Number(q.get('n') || 10), hue = Number(q.get('hue') || 260), word = q.get('word') || '';
const C = window.CHARACTERS, PAL = ['#FF6B6B', '#FF9F1C', '#FFD23F', '#2EC4B6', '#4D96FF', '#9B5DE5', '#F15BB5'];
const esc = x => x.replace(/&/g, '&amp;').replace(/</g, '&lt;');
function wrap(str, max) { const out = []; for (const w of str.split(/\s+/)) { const l = out[out.length - 1]; if (l && (l + ' ' + w).length <= max) out[out.length - 1] = l + ' ' + w; else out.push(w); } return out; }

let s = `<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${hue} 85% 70%)"/><stop offset="1" stop-color="hsl(${(hue + 60) % 360} 90% 80%)"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2A1B3D" flood-opacity="0.35"/></filter></defs>
<rect width="1920" height="1080" fill="url(#bg)"/>`;
for (let k = 0; k < 40; k++) {
  const x = (k * 263) % 1920, y = (k * 151) % 1080, r = 10 + (k % 4) * 5;
  s += `<path transform="translate(${x} ${y}) rotate(${k * 23}) scale(${r / 26})" d="M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z" fill="${PAL[k % 7]}" opacity="0.55"/>`;
}
s += `<g transform="translate(40 34)" filter="url(#sh)"><rect width="300" height="64" rx="32" fill="#fff"/><text x="150" y="44" text-anchor="middle" font-size="36" fill="#FF6B9A">Doodle Pals</text></g>`;

if (mode === 'intro') {
  const lines = wrap(title, 16), fs = Math.min(150, 1300 / (Math.max(...lines.map(l => l.length)) * 0.6), 420 / lines.length);
  lines.forEach((ln, k) => {
    s += `<text x="700" y="${430 - (lines.length - 1) * fs * 0.55 + k * fs * 1.08}" text-anchor="middle" font-size="${fs}" fill="${PAL[(k * 2 + 4) % 7]}" stroke="#fff" stroke-width="${fs * 0.16}" stroke-linejoin="round" paint-order="stroke" filter="url(#sh)">${esc(ln)}</text>`;
  });
  if (sub) s += `<g transform="translate(700 800)" filter="url(#sh)"><rect x="-460" y="-56" width="920" height="96" rx="28" fill="#3B2B4F"/><text y="10" text-anchor="middle" font-size="52" fill="#FFD23F">${esc(sub)}</text></g>`;
  s += `<g filter="url(#sh)"><g transform="translate(1750 1060) rotate(8) scale(1.3)">${C.coco({})}</g><g transform="translate(1390 1065) rotate(-6) scale(1.2)">${C.ellie({})}</g><g transform="translate(1570 1050) rotate(3) scale(1.45)">${C.penny({})}</g></g>`;
} else {
  // left panel: series title + "3 of 12" + progress dots
  const lines = wrap(title, 12), fs = Math.min(84, 560 / (Math.max(...lines.map(l => l.length)) * 0.6));
  lines.forEach((ln, k) => {
    s += `<text x="320" y="${230 + k * fs * 1.1}" text-anchor="middle" font-size="${fs}" fill="${PAL[(k * 2 + 4) % 7]}" stroke="#fff" stroke-width="${fs * 0.16}" stroke-linejoin="round" paint-order="stroke" filter="url(#sh)">${esc(ln)}</text>`;
  });
  s += `<g transform="translate(320 640)" filter="url(#sh)"><circle r="150" fill="#fff"/><text y="-20" text-anchor="middle" font-size="120" fill="#FF6B9A">${i}</text><text y="60" text-anchor="middle" font-size="44" fill="#5B4A7A">of ${n}</text></g>`;
  const dotW = Math.min(46, 520 / n);
  for (let k = 0; k < n; k++) s += `<circle cx="${320 + (k - (n - 1) / 2) * dotW}" cy="900" r="${dotW * 0.32}" fill="${k < i ? PAL[k % 7] : '#ffffff'}" stroke="#3B2B4F" stroke-width="3" opacity="${k < i ? 1 : 0.7}"/>`;
  // centre window frame (the video goes inside)
  s += `<rect x="648" y="-10" width="624" height="1100" rx="0" fill="#fff" filter="url(#sh)"/>`;
  // right panel: the pals cheering
  s += `<g filter="url(#sh)"><g transform="translate(1790 1050) rotate(8) scale(1.0)">${C.coco({})}</g><g transform="translate(1440 1055) rotate(-6) scale(0.95)">${C.ellie({})}</g><g transform="translate(1610 1040) rotate(3) scale(1.15)">${C.penny({})}</g></g>`;
}
document.getElementById('s').innerHTML = s;
</script>
</body>
</html>
