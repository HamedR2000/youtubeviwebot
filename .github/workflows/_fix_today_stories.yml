name: Fix Today Stories (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pillow requests

      - name: Re-render today's stories with the new background bank
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REEL_URL: https://github.com/HamedR2000/youtubeviwebot/releases/download/daily-2026-09-10/reel_2026-09-10.mp4
          REEL_CAPTION: |
            The one gold setup most traders miss.

            Round numbers like $2,000 or $2,300 often act as psychological support/resistance on XAU/USD.

            Tired of watching charts all day? My bot does it for you. Telegram channel in bio for subscription options.

            ⚠️ Educational content only, not financial advice. Trading gold/forex carries a high level of risk and may not be suitable for everyone. Past performance does not guarantee future results.

            #goldhamedsignals #investing #financialfreedom #priceaction #technicalanalysis #tradingsignals #forexsignals #goldprice #preciousmetals #wallstreet #tradertips #tradingstrategy #algotrading #fintech #tradinglife #forexmarket #goldinvestment #tradereducation #usdollar #marketanalysis #automatedtrading
        run: python instagram_bot/_fix_today_stories.py
