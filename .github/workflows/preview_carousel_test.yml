name: Preview Carousel Test

# Manual-only test workflow: renders one full carousel topic using the
# bespoke AI-art background bank (instagram_bot/backgrounds/) and uploads
# each slide as a Release asset for review. Does not touch Instagram at
# all -- purely for validating carousel_composer.py's visual output.

on:
  workflow_dispatch:
    inputs:
      topic_id:
        description: "Optional carousel_content.py topic id to render (random if omitted)"
        required: false
      theme:
        description: "Theme to render"
        required: false
        default: "dark"
        type: choice
        options:
          - dark
          - light

permissions:
  contents: write   # needed to create the Release asset

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r instagram_bot/requirements.txt

      - name: Render preview slide and publish as a Release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREVIEW_TOPIC_ID: ${{ github.event.inputs.topic_id }}
          PREVIEW_THEME: ${{ github.event.inputs.theme || 'dark' }}
        run: python instagram_bot/preview_carousel.py
