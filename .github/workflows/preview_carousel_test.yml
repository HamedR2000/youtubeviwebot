name: Preview Carousel Test

# Manual-only test workflow: renders ONE carousel slide with a real Pexels
# photo and uploads it as a build artifact for review. Does not touch
# Instagram at all -- purely for validating carousel_composer.py's visual
# output before it's wired into the daily pipeline.

on:
  workflow_dispatch: {}

permissions:
  contents: write   # needed to create the Release asset

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pillow requests

      - name: Render preview slide and publish as a Release asset
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python instagram_bot/preview_carousel.py
