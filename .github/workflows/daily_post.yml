name: Daily Instagram Post

on:
  # No cron here on purpose: the daily wake-up + "show me before it posts"
  # loop lives in the Claude session (a scheduled Routine), which triggers
  # this workflow via the API in "generate" mode, then -- only after the
  # account owner approves what it built -- triggers it again in "publish"
  # mode with that run's manifest_url.
  workflow_dispatch:
    inputs:
      mode:
        description: "generate (build + host assets, no Instagram calls) or publish (post an already-approved manifest)"
        type: choice
        options: [generate, publish]
        default: generate
      manifest_url:
        description: "Required for mode=publish: the manifest.json URL a prior generate run printed"
        type: string
        required: false

permissions:
  contents: write   # needed to create the Release asset and (generate mode) commit state.json

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (ffmpeg + fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r instagram_bot/requirements.txt

      - name: Run pipeline
        env:
          PIPELINE_MODE: ${{ github.event.inputs.mode || 'generate' }}
          MANIFEST_URL: ${{ github.event.inputs.manifest_url }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python instagram_bot/main.py

      - name: Commit updated state.json (generate mode only)
        if: github.event.inputs.mode != 'publish'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram_bot/state.json
          git diff --cached --quiet || git commit -m "chore: update daily post state [skip ci]"
          git push
